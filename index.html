<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune 5x5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#f0f4f8;--gold:#ffd966;--green:#2ecc71;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;height:100dvh;}

/* Главный контейнер */
.app {
    position: relative; width: 100vw; height: 100dvh;
    background: url('bg.png?v=65') no-repeat center center;
    background-size: 100% 100%; overflow: hidden;
}

/* ---------------- МАГИЯ ЛЕСА ---------------- */
.fire-glow { position: absolute; top: 14%; width: 12%; height: 4%; background: radial-gradient(circle, rgba(255, 140, 0, 0.8) 0%, transparent 70%); mix-blend-mode: screen; pointer-events: none; z-index: 5; animation: fireFlicker 1.5s infinite alternate; }
.fire-left { left: 12%; }
.fire-right { right: 12%; }
@keyframes fireFlicker { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.2); } }

.app::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1; box-shadow: inset 0 0 40px rgba(46, 204, 113, 0.3); animation: holoPulse 3s infinite alternate; }
@keyframes holoPulse { 0% { box-shadow: inset 0 0 20px rgba(46, 204, 113, 0.2); } 100% { box-shadow: inset 0 0 60px rgba(46, 204, 113, 0.6); } }

.firefly { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #a8ff78; box-shadow: 0 0 15px 4px #2ecc71, 0 0 5px #fff; pointer-events: none; z-index: 6; opacity: 0; animation: floatFly 3s infinite ease-in-out; }
.f1 { bottom: 15%; left: 5%; animation-delay: 0s; } .f2 { bottom: 22%; left: 9%; animation-delay: 1s; } .f3 { bottom: 16%; right: 6%; animation-delay: 0.5s; }
.f4 { bottom: 25%; right: 10%; animation-delay: 1.5s; } .f5 { bottom: 30%; left: 3%; animation-delay: 2s; } .f6 { bottom: 35%; right: 4%; animation-delay: 0.8s; }
@keyframes floatFly { 0%, 100% { transform: translateY(0) scale(0.5); opacity: 0; } 50% { transform: translateY(-30px) scale(1.5); opacity: 1; } }

/* ---------------- ТЕКСТ ---------------- */
.ui-text { position: absolute; z-index: 50; display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 900; text-shadow: 1px 1px 2px #000, 0 0 5px #000; }
.ui-balance { top: 23%; left: 15%; width: 25%; height: 3%; font-size: 1.8vh; }
.ui-win { top: 23%; right: 15%; width: 25%; height: 3%; font-size: 1.8vh; }
.ui-lines { bottom: 29.5%; left: 11%; width: 18%; height: 3%; font-size: 1.6vh; }
.ui-bet { bottom: 29.5%; left: 41%; width: 18%; height: 3%; font-size: 1.6vh; }
.ui-total { bottom: 29.5%; right: 11%; width: 18%; height: 3%; font-size: 1.6vh; }

.ui-spin-text { bottom: 22%; left: 35%; width: 30%; height: 4%; font-size: 1.8vh; color: #fff; text-shadow: 0 2px 4px #000; letter-spacing: 1px; }

/* Добавили текст для AUTO */
.ui-auto-text { bottom: 22.5%; right: 8.5%; width: 15%; height: 5.5%; font-size: 1.5vh; color: #fff; display: flex; flex-direction: column; line-height: 1.1; }

/* ---------------- БАРАБАНЫ 5x5 (УМЕНЬШИЛИ, ЧТОБЫ ВИДНЫ БЫЛИ РАМКИ) ---------------- */
.reels-frame { 
    position: absolute; 
    top: 27.5%; /* Опустили чуть ниже */
    left: 14.5%; /* Сузили слева */
    right: 14.5%; /* Сузили справа */
    height: 38%; /* Уменьшили высоту */
    background: #0d2112; 
    border-radius: 4px; 
    overflow: hidden; 
    z-index: 10; 
    border: 2px solid #3a2311; 
    box-shadow: inset 0 0 20px #000; 
}
.reels { display: grid; grid-template-columns: repeat(5, 1fr); height: 100%; width: 100%; background: #000; gap: 1px; }
.reel { background: #0d2112; overflow: hidden; position: relative; height: 100%; }
.track { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; }
.cell { display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; width: 100%; } 
.cell img { width: 88%; height: 88%; object-fit: contain; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5)) drop-shadow(0 2px 2px rgba(0,0,0,0.8)); }
.cell.win::before { content: ""; position: absolute; inset: 2px; border: 2px solid #a8ff78; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,113,.6), transparent 70%); box-shadow: 0 0 15px #2ecc71; animation: winPulse .4s infinite alternate; }
@keyframes winPulse { 0%{transform:scale(.9)} 100%{transform:scale(1.1)} }

/* ---------------- КНОПКИ ---------------- */
.btn-overlay { position: absolute; z-index: 99; cursor: pointer; border-radius: 10px; }
.btn-overlay:active { background: rgba(255,255,255,0.2); }
.btn-spin { bottom: 21%; left: 35%; width: 30%; height: 7%; border-radius: 20px; }
.btn-auto { bottom: 22.5%; right: 8.5%; width: 15%; height: 5.5%; } /* Кликабельная зона AUTO */

.btn-lines-dec { bottom: 29.5%; left: 7%; width: 4%; height: 3%; }
.btn-lines-inc { bottom: 29.5%; left: 26%; width: 4%; height: 3%; }
.btn-bet-dec { bottom: 29.5%; left: 37%; width: 4%; height: 3%; }
.btn-bet-inc { bottom: 29.5%; left: 56%; width: 4%; height: 3%; }

.btn-l1 { bottom: 26.5%; left: 11%; width: 3.5%; height: 2.5%; }
.btn-l3 { bottom: 26.5%; left: 15.5%; width: 3.5%; height: 2.5%; }
.btn-l5 { bottom: 26.5%; left: 20%; width: 3.5%; height: 2.5%; }
.btn-l9 { bottom: 26.5%; left: 24.5%; width: 3.5%; height: 2.5%; }
.btn-l15 { bottom: 26.5%; left: 29%; width: 3.5%; height: 2.5%; }
.btn-l21 { bottom: 26.5%; left: 33.5%; width: 3.5%; height: 2.5%; }

.btn-action { bottom: 13%; width: 11%; height: 5%; }
.btn-wheel { left: 1.5%; } .btn-shop { left: 14%; } .btn-risk { left: 26.5%; } .btn-friends { left: 39%; }
.btn-tasks { right: 39%; } .btn-top { right: 26.5%; } .btn-bonus { right: 14%; } .btn-rules { right: 1.5%; }

.btn-lang-ru { top: 1.5%; left: 4%; width: 8%; height: 3.5%; }
.btn-lang-uk { top: 1.5%; left: 13%; width: 8%; height: 3.5%; }
.btn-lang-en { top: 1.5%; left: 22%; width: 8%; height: 3.5%; }

/* ---------------- МОДАЛКИ ---------------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;padding:15px}
.modal.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,#1a2e1a,#0a1208);border:2px solid var(--gold);border-radius:14px;padding:16px;max-width:380px;width:100%;text-align:center;color:#fff}
.modal-title{font-size:18px;font-weight:900;color:var(--gold);margin-bottom:10px}
.modal-close{background:#576574;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:800;margin-top:10px;width:100%}

.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:800;transition:top .3s;z-index:2000;text-align:center}
.notif.show{top:15px} .notif.error{background:#e74c3c} .notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
</style>
</head>
<body>

<!-- Стартовый экран для активации звука -->
<div style="position:fixed; inset:0; background:#0a1208; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center;" id="startOverlay">
    <div style="font-size:70px; margin-bottom:10px;">🦔</div>
    <div style="font-size:28px; font-weight:900; color:#a8ff78; font-family:Georgia,serif; margin-bottom:20px;">FOREST FORTUNE</div>
    <button id="startBtn" style="background:linear-gradient(180deg,#2ecc71,#1a7d43); border:none; padding:15px 40px; border-radius:10px; color:#fff; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 5px 0 #0a1208;">ИГРАТЬ 🔊</button>
</div>

<div class="app" id="gameArea">
    <div class="fire-glow fire-left"></div><div class="fire-glow fire-right"></div>
    <div class="firefly f1"></div><div class="firefly f2"></div><div class="firefly f3"></div><div class="firefly f4"></div><div class="firefly f5"></div><div class="firefly f6"></div>

    <div class="ui-text ui-balance" id="balanceVal">50 000</div>
    <div class="ui-text ui-win" id="winVal">0</div>
    <div class="ui-text ui-lines" id="linesVal">21</div>
    <div class="ui-text ui-bet" id="betVal">1</div>
    <div class="ui-text ui-total" id="totalBetVal">21</div>
    
    <div class="ui-text ui-spin-text" id="spinText">КРУТИТЬ</div>
    <!-- Добавили текст AUTO -->
    <div class="ui-text ui-auto-text">AUTO<br><span style="font-size:1.2vh;">10x</span></div>

    <div class="reels-frame" id="reelsFrame"><div class="reels" id="reels"></div></div>

    <div class="btn-overlay btn-spin" id="spinBtn"></div>
    <div class="btn-overlay btn-auto" id="autoBtn"></div>
    
    <div class="btn-overlay btn-lines-dec" id="linesDec"></div>
    <div class="btn-overlay btn-lines-inc" id="linesInc"></div>
    <div class="btn-overlay btn-bet-dec" id="betDec"></div>
    <div class="btn-overlay btn-bet-inc" id="betInc"></div>

    <div class="btn-overlay btn-l1" id="btnL1"></div>
    <div class="btn-overlay btn-l3" id="btnL3"></div>
    <div class="btn-overlay btn-l5" id="btnL5"></div>
    <div class="btn-overlay btn-l9" id="btnL9"></div>
    <div class="btn-overlay btn-l15" id="btnL15"></div>
    <div class="btn-overlay btn-l21" id="btnL21"></div>

    <div class="btn-overlay btn-action btn-wheel" onclick="openModal('wheelModal')"></div>
    <div class="btn-overlay btn-action btn-shop" onclick="openModal('shopModal')"></div>
    <div class="btn-overlay btn-action btn-risk" onclick="openModal('riskModal')"></div>
    <div class="btn-overlay btn-action btn-friends" onclick="openModal('friendsModal')"></div>
    <div class="btn-overlay btn-action btn-tasks" onclick="openModal('tasksModal')"></div>
    <div class="btn-overlay btn-action btn-top" onclick="openModal('topModal')"></div>
    <div class="btn-overlay btn-action btn-bonus" onclick="claimDaily()"></div>
    <div class="btn-overlay btn-action btn-rules" onclick="openModal('paytableModal')"></div>

    <!-- Кнопки языков -->
    <div class="btn-overlay btn-lang-ru" onclick="setLang('ru')"></div>
    <div class="btn-overlay btn-lang-uk" onclick="setLang('uk')"></div>
    <div class="btn-overlay btn-lang-en" onclick="setLang('en')"></div>
</div>

<!-- МОДАЛКИ -->
<div class="modal" id="wheelModal"><div class="modal-box"><div class="modal-title">🎡 КОЛЕСО</div><div class="modal-text">Крути раз в 24 часа!</div><button class="modal-close" onclick="closeModal('wheelModal')">Закрыть</button></div></div>
<div class="modal" id="shopModal"><div class="modal-box"><div class="modal-title">⭐ МАГАЗИН</div><div class="modal-text">Покупка звезд (в разработке)</div><button class="modal-close" onclick="closeModal('shopModal')">Закрыть</button></div></div>
<div class="modal" id="riskModal"><div class="modal-box"><div class="modal-title">🃏 РИСК</div><div class="modal-text" id="riskText"></div><div class="modal-btns"><button class="modal-btn green" onclick="riskChoose(true)">ВЫШЕ</button><button class="modal-btn red" onclick="riskChoose(false)">НИЖЕ</button></div><button class="modal-close" onclick="closeModal('riskModal'); pendingRisk=0;">Забрать</button></div></div>
<div class="modal" id="friendsModal"><div class="modal-box"><div class="modal-title">🤝 ДРУЗЬЯ</div><div class="modal-text">Приглашайте и получайте 5000 монет!</div><button class="modal-close" onclick="closeModal('friendsModal')">Закрыть</button></div></div>
<div class="modal" id="tasksModal"><div class="modal-box"><div class="modal-title">📜 ЗАДАНИЯ</div><div class="modal-text">Скоро тут будут задания</div><button class="modal-close" onclick="closeModal('tasksModal')">Закрыть</button></div></div>
<div class="modal" id="topModal"><div class="modal-box"><div class="modal-title">🏆 ТОП</div><div class="modal-text">Загрузка...</div><button class="modal-close" onclick="closeModal('topModal')">Закрыть</button></div></div>
<div class="modal" id="paytableModal"><div class="modal-box"><div class="modal-title">📋 ПРАВИЛА</div><div class="modal-text">Собери 3+ одинаковых символа слева направо</div><button class="modal-close" onclick="closeModal('paytableModal')">Закрыть</button></div></div>

<div class="notif" id="notif"></div>

<script>
const REELS = 5, ROWS = 5; 
const IMG_VER = '?v=65';
const SYMBOLS = ['gem.png', 'mushroom.png', 'hedgehog.png', 'acorn.png', 'leaf.png', 'coin.png'];
const WEIGHTS = {'gem.png':5, 'mushroom.png':10, 'hedgehog.png':15, 'acorn.png':25, 'leaf.png':25, 'coin.png':30};
const PAYTABLE = { 'gem.png': [15, 60, 250], 'mushroom.png': [10, 40, 150], 'hedgehog.png': [8, 25, 80], 'acorn.png': [5, 15, 50], 'leaf.png': [5, 15, 50], 'coin.png': [2, 5, 15] };
const PAYLINES = [
    [[0,0],[1,0],[2,0],[3,0],[4,0]], [[0,1],[1,1],[2,1],[3,1],[4,1]], [[0,2],[1,2],[2,2],[3,2],[4,2]], [[0,3],[1,3],[2,3],[3,3],[4,3]], [[0,4],[1,4],[2,4],[3,4],[4,4]],
    [[0,0],[1,1],[2,2],[3,1],[4,0]], [[0,4],[1,3],[2,2],[3,3],[4,4]], [[0,1],[1,2],[2,3],[3,2],[4,1]], [[0,3],[1,2],[2,1],[3,2],[4,3]],
    [[0,0],[1,0],[2,1],[3,2],[4,2]], [[0,4],[1,4],[2,3],[3,2],[4,2]], [[0,2],[1,1],[2,0],[3,1],[4,2]], [[0,2],[1,3],[2,4],[3,3],[4,2]],
    [[0,1],[1,0],[2,0],[3,0],[4,1]], [[0,3],[1,4],[2,4],[3,4],[4,3]], [[0,0],[1,1],[2,1],[3,1],[4,0]], [[0,4],[1,3],[2,3],[3,3],[4,4]],
    [[0,1],[1,1],[2,2],[3,3],[4,3]], [[0,3],[1,3],[2,2],[3,1],[4,1]], [[0,0],[1,2],[2,4],[3,2],[4,0]], [[0,4],[1,2],[2,0],[3,2],[4,4]]
];
const POOL=[];Object.entries(WEIGHTS).forEach(([s,w])=>{for(let i=0;i<w;i++)POOL.push(s)});

let state = { balance: 50000, betPerLine: 1, lines: 21, lang: 'ru', lastDaily: 0 };
let isSpinning = false, stopRequested = false, cellH = 0, audioReady = false;
let freeSpins = 0, isFreeSpin = false, pendingRisk = 0;

const reelsEl = document.getElementById('reels');
const tracks = [];

function $(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
function notif(msg, type='') { const n=$('notif'); n.textContent=msg; n.className='notif show '+type; clearTimeout(n._t); n._t=setTimeout(()=>{n.className='notif '+type}, 2400); }
function randSym() { return POOL[Math.floor(Math.random()*POOL.length)]; }
function totalBet() { return state.lines * state.betPerLine; }
function openModal(id) { $(id).classList.add('active'); }
function closeModal(id) { $(id).classList.remove('active'); }
function setLang(l) { state.lang = l; notif('Язык: ' + l.toUpperCase()); }

function buildAudio() { if(audioReady) return; audioReady = true; }

function buildReels() {
    reelsEl.innerHTML = ''; tracks.length = 0;
    const frame = document.querySelector('.reels-frame');
    setTimeout(() => {
        // Высота ячейки теперь высчитывается от новой, уменьшенной рамки
        cellH = frame.getBoundingClientRect().height / ROWS;
        for (let r = 0; r < REELS; r++) {
            const reel = document.createElement('div'); reel.className = 'reel';
            const track = document.createElement('div'); track.className = 'track';
            let html = '';
            for (let row = 0; row < ROWS; row++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
            track.innerHTML = html; reel.appendChild(track); reelsEl.appendChild(reel); tracks.push(track);
        }
        updateUI();
    }, 300);
}

let reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

function startReelSpin(r) {
    const track = tracks[r]; let html = ''; 
    for (let i = 0; i < 40; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
    track.innerHTML = html; let lastTime = performance.now(); const speed = 2000;
    function frame(now) {
        if (!isSpinning) return; const dt = (now - lastTime) / 1000; lastTime = now;
        reelPositions[r] -= speed * dt; if (reelPositions[r] <= -(20 * cellH)) reelPositions[r] += 20 * cellH;
        track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
        reelAnimFrames[r] = requestAnimationFrame(frame);
    }
    reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final5) {
    return new Promise(resolve => {
        setTimeout(() => {
            cancelAnimationFrame(reelAnimFrames[r]); const track = tracks[r]; const currentY = reelPositions[r];
            let html = ''; 
            for (let i = 0; i < 15; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
            final5.forEach(s => html += `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`);
            for (let i = 0; i < 5; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
            track.innerHTML = html; let startY = currentY % (15 * cellH); if(startY > 0) startY -= 15 * cellH;
            track.style.transition = 'none'; track.style.transform = `translate3d(0, ${startY}px, 0)`; track.getBoundingClientRect();
            track.style.transition = `transform ${800 + r*200}ms cubic-bezier(0.1, 0.8, 0.2, 1)`; track.style.transform = `translate3d(0, -${15 * cellH}px, 0)`;
            setTimeout(() => { track.style.transition = 'none'; track.style.transform = 'translate3d(0,0,0)'; track.innerHTML = final5.map(s => `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`).join(''); resolve(); }, 800 + r*200 + 50);
        }, r * 200);
    });
}

function updateUI() {
    $('balanceVal').textContent = fmt(state.balance); 
    $('betVal').textContent = fmt(state.betPerLine); 
    $('linesVal').textContent = state.lines;
    $('totalBetVal').textContent = fmt(totalBet());
    if(!isSpinning) $('winVal').textContent = '0';
}

function setLines(num) {
    if(isSpinning) return; state.lines = num; updateUI(); notif('Линий: ' + num);
}

async function startSpin() {
    if (isSpinning) return;
    if (state.balance < totalBet()) { notif('Мало монет!', 'error'); return; }
    state.balance -= totalBet(); isSpinning = true; stopRequested = false; $('winVal').textContent = '0';
    updateUI(); $('spinText').textContent = 'СТОП';
    const finalGrid = []; for (let r=0; r<REELS; r++) { const col=[]; for(let c=0; c<ROWS; c++) col.push(randSym()); finalGrid.push(col); }
    reelPositions = [0, 0, 0, 0, 0]; tracks.forEach((tr, i) => startReelSpin(i));
    setTimeout(() => { if(!stopRequested) requestStop(finalGrid); }, 1500);
}

async function requestStop(pregeneratedGrid) {
    if (!isSpinning || stopRequested) return; stopRequested = true;
    const finalGrid = pregeneratedGrid; await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i])));
    
    let total = 0, scatterCount = 0;
    for(let r=0; r<REELS; r++) for(let c=0; c<ROWS; c++) if(finalGrid[r][c] === 'mushroom.png') scatterCount++;

    PAYLINES.slice(0, state.lines).forEach(line => {
        const syms = line.map(([r,row])=>finalGrid[r][row]); const firstSym = syms[0];
        if(firstSym === 'mushroom.png') return;
        let count = 1;
        for(let i=1; i<REELS; i++) { if(syms[i] === firstSym || syms[i] === 'gem.png') count++; else break; }
        if(count >= 3) total += PAYTABLE[firstSym][count-3] * state.betPerLine;
    });

    if (total > 0) {
        if (isFreeSpin) total *= 2;
        state.balance += total; $('winVal').textContent = fmt(total); notif('Выигрыш: +' + fmt(total), 'gold');
        if (total >= totalBet() * 2 && !isFreeSpin) pendingRisk = total;
    } else { notif('Повезет в следующий раз!', 'error'); }

    if (scatterCount >= 3 && !isFreeSpin) { freeSpins = 10; notif('🎉 3 ГРИБА! 10 ФРИСПИНОВ x2!', 'gold'); }
    
    isSpinning = false; $('spinText').textContent = 'КРУТИТЬ'; updateUI();

    if (freeSpins > 0) { freeSpins--; isFreeSpin = true; setTimeout(startSpin, 1000); } 
    else { isFreeSpin = false; }
}

function riskChoose(win) {
    const won = Math.random() < 0.5 ? win : !win; closeModal('riskModal');
    if(won) { state.balance += pendingRisk; notif('🎉 Победа! +' + fmt(pendingRisk), 'gold'); } 
    else { state.balance -= pendingRisk; notif('❌ Не повезло', 'error'); }
    pendingRisk = 0; updateUI();
}

function claimDaily() {
    if (Date.now() - state.lastDaily < 24*3600*1000) { notif('Уже получен', 'error'); return; }
    state.lastDaily = Date.now(); state.balance += 1000; updateUI(); notif('🎁 Бонус: +1000', 'gold');
}

$('startBtn').onclick = () => { buildAudio(); $('startOverlay').style.display = 'none'; buildReels(); };
$('spinBtn').onclick = () => { if (isSpinning) requestStop(); else startSpin(); };
$('autoBtn').onclick = () => { notif('Автоспин (10x) активирован'); startSpin(); }; // Теперь кнопка AUTO работает
$('linesDec').onclick = () => { if(!isSpinning){ state.lines = Math.max(1, state.lines-1); updateUI(); } };
$('linesInc').onclick = () => { if(!isSpinning){ state.lines = Math.min(21, state.lines+1); updateUI(); } };
$('betDec').onclick = () => { if(!isSpinning){ state.betPerLine = Math.max(1, state.betPerLine-1); updateUI(); } };
$('betInc').onclick = () => { if(!isSpinning){ state.betPerLine += 1; updateUI(); } };

$('btnL1').onclick = () => setLines(1); $('btnL3').onclick = () => setLines(3); $('btnL5').onclick = () => setLines(5);
$('btnL9').onclick = () => setLines(9); $('btnL15').onclick = () => setLines(15); $('btnL21').onclick = () => setLines(21);

window.addEventListener('resize', () => { if(!isSpinning) buildReels(); });
</script>
</body>
</html>
