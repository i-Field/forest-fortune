<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#f0f4f8;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;height:100dvh;}

/* Главный контейнер с игрой (сохраняем пропорции картинки 16:9) */
.app {
    position: relative;
    width: 100vw;
    max-width: 100vh * 1.777; /* соотношение сторон 16:9 */
    aspect-ratio: 16 / 9;
    background: url('bg.png?v=8') no-repeat center center;
    background-size: 100% 100%;
    margin: auto;
}

/* ---------------- ДИНАМИЧЕСКИЙ ТЕКСТ ПОВЕРХ КАРТИНКИ ---------------- */
/* Баланс (верхний левый угол) */
.ui-balance {
    position: absolute; top: 3.5%; left: 14%; width: 14%; height: 5%;
    display: flex; align-items: center; justify-content: center;
    color: #ffd966; font-size: 2.2vh; font-weight: 900; text-shadow: 1px 1px 2px #000;
}
/* Выигрыш (верхний правый угол) */
.ui-win {
    position: absolute; top: 3.5%; right: 13%; width: 14%; height: 5%;
    display: flex; align-items: center; justify-content: center;
    color: #ffd966; font-size: 2.2vh; font-weight: 900; text-shadow: 1px 1px 2px #000;
}
/* Линии (внизу слева) */
.ui-lines {
    position: absolute; bottom: 4.5%; left: 11%; width: 8%; height: 5%;
    display: flex; align-items: center; justify-content: center;
    color: #ffd966; font-size: 1.8vh; font-weight: 900;
}
/* Ставка (внизу по центру) */
.ui-bet {
    position: absolute; bottom: 4.5%; left: 33%; width: 8%; height: 5%;
    display: flex; align-items: center; justify-content: center;
    color: #ffd966; font-size: 1.8vh; font-weight: 900;
}
/* Всего (внизу справа) */
.ui-total {
    position: absolute; bottom: 4.5%; right: 26%; width: 8%; height: 5%;
    display: flex; align-items: center; justify-content: center;
    color: #ffd966; font-size: 1.8vh; font-weight: 900;
}

/* ---------------- БАРАБАНЫ ---------------- */
.reels-frame {
    position: absolute;
    top: 14.5%;    
    left: 16%;   
    right: 16%;  
    bottom: 22%; 
    background: transparent; 
    border-radius: 4px;
    overflow: hidden;
    z-index: 4;
}
.reels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; position: relative; z-index: 1; height: 100%; }
.reel { background: transparent; height: 100%; overflow: hidden; position: relative; }
.reel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 15px; background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); z-index: 3; pointer-events: none; }
.reel::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 15px; background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent); z-index: 3; pointer-events: none; }
.reel-flash { position: absolute; inset: 0; background: rgba(46,204,113,0); pointer-events: none; z-index: 4; transition: background .1s; }
.reel-flash.flash { background: rgba(168,255,120,.9); }
.track { position: absolute; left: 0; right: 0; top: 0; transform: translate3d(0,0,0); will-change: transform; }
.cell { height: 12.3vh; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; } /* Высота подстраивается под экран */
.cell img { width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6)) drop-shadow(0 2px 4px rgba(0,0,0,0.9)); }
.cell.win::before { content: ""; position: absolute; inset: 2px; border: 2px solid #a8ff78; border-radius: 6px; background: radial-gradient(circle, rgba(46,204,113,.5), transparent 70%); pointer-events: none; box-shadow: 0 0 15px rgba(46,204,113,1); animation: winPulse .5s infinite alternate; }
@keyframes winPulse { 0%{transform:scale(.95)} 100%{transform:scale(1.05)} }
.lines-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }

/* ---------------- НЕВИДИМЫЕ КНОПКИ (КЛИКАБЕЛЬНЫЕ ЗОНЫ) ---------------- */
/* Они прозрачные, но нажимаются! */
.btn-overlay {
    position: absolute;
    z-index: 10;
    cursor: pointer;
    border-radius: 10px;
}
.btn-overlay:active { background: rgba(255,255,255,0.2); }

/* Позиции кнопок (подгоняем под картинку) */
.btn-spin { bottom: 1%; left: 41%; width: 18%; height: 16%; border-radius: 50%; }
.btn-auto { bottom: 5%; right: 17%; width: 8%; height: 10%; }
.btn-lines-down { bottom: 5%; left: 7%; width: 4%; height: 10%; }
.btn-lines-up { bottom: 5%; left: 18%; width: 4%; height: 10%; }
.btn-bet-down { bottom: 5%; left: 25%; width: 4%; height: 10%; }
.btn-bet-up { bottom: 5%; left: 41%; width: 4%; height: 10%; }

/* Кнопки действий внизу (Колесо, Магазин и т.д.) */
.btn-action { bottom: 1.5%; width: 7%; height: 8%; }
.btn-wheel { left: 2.5%; }
.btn-shop { left: 11%; }
.btn-risk { left: 19.5%; }
/* Кнопки справа */
.btn-tasks { right: 27%; }
.btn-top { right: 19.5%; }
.btn-bonus { right: 12%; }
.btn-rules { right: 4.5%; }

/* Языки наверху */
.btn-lang-ru { top: 1.5%; left: 9%; width: 5%; height: 4%; }
.btn-lang-uk { top: 1.5%; left: 15%; width: 5%; height: 4%; }
.btn-lang-en { top: 1.5%; left: 21%; width: 5%; height: 4%; }

/* ---------------- МОДАЛКИ, УВЕДОМЛЕНИЯ (Оставляем как было) ---------------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:15px}
.modal.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,#1a2e1a,#0a1208);border:2px solid #d4af37;border-radius:14px;padding:16px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.8);text-align:center;max-height:90vh;overflow-y:auto;color:#fff}
.modal-title{font-size:18px;font-weight:900;color:#ffd966;margin-bottom:10px;font-family:Georgia,serif}
.modal-text{font-size:12px;color:#8899aa;margin-bottom:14px;line-height:1.4}
.modal-close{background:#576574;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;margin-top:10px;width:100%}
/* Остальные стили модалок оставляем из предыдущей версии */
.pt-table{width:100%;border-collapse:collapse;font-size:11px}
.pt-table thead th{color:#ffd966;padding:4px;border-bottom:1px solid #455872;font-size:10px}
.pt-table tbody td{padding:5px;border-bottom:1px solid rgba(69,88,114,.4);font-variant-numeric:tabular-nums}
.pt-sym img{width:30px;height:30px;object-fit:contain;}
.pt-val{color:#ffd966;font-weight:800}
.shop-grid{display:flex;flex-direction:column;gap:6px}
.shop-card{background:#1a2e1a;border:1px solid #2a4a2a;border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.shop-left{text-align:left}
.shop-name{font-size:11px;color:#8899aa;font-weight:700}
.shop-coins{font-size:18px;font-weight:900;color:#ffd966}
.shop-price{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;padding:8px 12px;border-radius:8px;font-weight:900;font-size:13px}
.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:800;box-shadow:0 5px 15px rgba(0,0,0,.5);transition:top .3s;z-index:999;max-width:90vw;text-align:center}
.notif.show{top:15px}
.notif.error{background:#e74c3c}
.notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
.bigwin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.bigwin-overlay.active{opacity:1;pointer-events:auto}
.bigwin-text{font-size:50px;font-weight:900;color:#a8ff78;font-family:Georgia,serif;text-shadow:0 0 20px #a8ff78, 0 0 50px #2ecc71;animation:bigWinZoom 0.5s ease-out infinite alternate}
@keyframes bigWinZoom{0%{transform:scale(1)}100%{transform:scale(1.1)}}
.bigwin-amount{font-size:40px;font-weight:900;color:#fff;margin-top:20px;text-shadow:0 0 15px #2ecc71;animation:bigWinZoom 0.5s ease-out infinite alternate}
.start-overlay{position:fixed;inset:0;background:radial-gradient(circle at center,#0a1a05,#000);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.start-overlay.hidden{opacity:0;pointer-events:none}
.start-box{text-align:center;padding:20px;max-width:320px;color:#fff}
.start-btn{width:100%;background:linear-gradient(180deg,#2ecc71,#1a7d43);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:900;cursor:pointer;margin-bottom:6px;box-shadow:0 4px 0 #0a1208}
</style>
</head>
<body>

<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div style="font-size:70px;margin-bottom:10px;filter:drop-shadow(0 0 20px #2ecc71)">🦔</div>
    <div style="font-size:28px;font-weight:900;letter-spacing:2px;color:#a8ff78;margin-bottom:6px;font-family:Georgia,serif">FOREST FORTUNE</div>
    <div style="color:#8899aa;font-size:12px;margin-bottom:20px">Магия леса и сокровища</div>
    <button class="start-btn" id="startSound">🔊 Играть со звуком</button>
    <button class="start-btn" style="background:#576574" id="startMute">🔇 Без звука</button>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div class="app" id="gameArea">
    
    <!-- Динамический текст -->
    <div class="ui-balance" id="balanceVal">50 000</div>
    <div class="ui-win" id="winVal">0</div>
    <div class="ui-lines" id="linesVal">21</div>
    <div class="ui-bet" id="betVal">1</div>
    <div class="ui-total" id="totalBetVal">21</div>

    <!-- Сетка барабанов -->
    <div class="reels-frame">
        <div class="reels" id="reels"></div>
        <svg class="lines-overlay" id="linesOverlay"></svg>
    </div>

    <!-- НЕВИДИМЫЕ КНОПКИ ПОВЕРХ НАРИСОВАННЫХ -->
    <div class="btn-overlay btn-spin" id="spinBtn"></div>
    <div class="btn-overlay btn-auto" id="autoBtn"></div>
    <div class="btn-overlay btn-lines-down" id="linesDec"></div>
    <div class="btn-overlay btn-lines-up" id="linesInc"></div>
    <div class="btn-overlay btn-bet-down" id="betDec"></div>
    <div class="btn-overlay btn-bet-up" id="betInc"></div>

    <div class="btn-overlay btn-action btn-wheel" id="wheelBtn"></div>
    <div class="btn-overlay btn-action btn-shop" id="shopBtn"></div>
    <div class="btn-overlay btn-action btn-risk" id="riskBtn"></div>
    
    <div class="btn-overlay btn-action btn-tasks" id="tasksBtn"></div>
    <div class="btn-overlay btn-action btn-top" id="topBtn"></div>
    <div class="btn-overlay btn-action btn-bonus" id="bonusBtn"></div>
    <div class="btn-overlay btn-action btn-rules" id="paytableBtn"></div>

    <div class="btn-overlay btn-lang-ru" onclick="setLang('ru')"></div>
    <div class="btn-overlay btn-lang-uk" onclick="setLang('uk')"></div>
    <div class="btn-overlay btn-lang-en" onclick="setLang('en')"></div>

</div>

<!-- МОДАЛКИ (скрыты по умолчанию) -->
<div class="modal" id="wheelModal"><div class="modal-box"><div class="modal-title">🎡 КОЛЕСО</div><button class="modal-close" onclick="closeModal('wheelModal')">Закрыть</button></div></div>
<div class="modal" id="shopModal"><div class="modal-box"><div class="modal-title">⭐ МАГАЗИН</div><button class="modal-close" onclick="closeModal('shopModal')">Закрыть</button></div></div>
<div class="modal" id="riskModal"><div class="modal-box"><div class="modal-title">🃏 РИСК</div><button class="modal-close" onclick="closeModal('riskModal')">Закрыть</button></div></div>
<div class="modal" id="tasksModal"><div class="modal-box"><div class="modal-title">📜 ЗАДАНИЯ</div><button class="modal-close" onclick="closeModal('tasksModal')">Закрыть</button></div></div>
<div class="modal" id="topModal"><div class="modal-box"><div class="modal-title">🏆 ТОП</div><button class="modal-close" onclick="closeModal('topModal')">Закрыть</button></div></div>
<div class="modal" id="paytableModal"><div class="modal-box"><div class="modal-title">📋 ПРАВИЛА</div><button class="modal-close" onclick="closeModal('paytableModal')">Закрыть</button></div></div>

<div class="bigwin-overlay" id="bigWinOverlay">
  <div class="bigwin-text">BIG WIN!</div>
  <div class="bigwin-amount" id="bigWinAmount">0 🪙</div>
</div>
<div class="notif" id="notif"></div>

<script>
// --- ЛОГИКА ИГРЫ ---
const REELS=5, ROWS=3, MAX_LINES=21;
const IMG_VER = '?v=8';
const SYMBOLS=['gem.png','mushroom.png','hedgehog.png','acorn.png','leaf.png','coin.png'];
const WEIGHTS={'gem.png':5,'mushroom.png':10,'hedgehog.png':15,'acorn.png':25,'leaf.png':25,'coin.png':40};
const PAYTABLE={'gem.png':[15,60,250],'mushroom.png':[10,40,150],'hedgehog.png':[8,25,80],'acorn.png':[5,15,50],'leaf.png':[5,15,50],'coin.png':[2,5,15]};
const PAYLINES=[
  [[0,0],[1,0],[2,0],[3,0],[4,0]],[[0,1],[1,1],[2,1],[3,1],[4,1]],[[0,2],[1,2],[2,2],[3,2],[4,2]],
  [[0,0],[1,1],[2,2],[3,1],[4,0]],[[0,2],[1,1],[2,0],[3,1],[4,2]],[[0,0],[1,0],[2,1],[3,2],[4,2]],
  [[0,2],[1,2],[2,1],[3,0],[4,0]],[[0,1],[1,0],[2,0],[3,0],[4,1]],[[0,1],[1,2],[2,2],[3,2],[4,1]],
  [[0,0],[1,1],[2,0],[3,1],[4,0]],[[0,2],[1,1],[2,2],[3,1],[4,2]],[[0,0],[1,2],[2,0],[3,2],[4,0]],
  [[0,2],[1,0],[2,2],[3,0],[4,2]],[[0,0],[1,1],[2,1],[3,1],[4,0]],[[0,2],[1,1],[2,1],[3,1],[4,2]],
  [[0,1],[1,0],[2,1],[3,0],[4,1]],[[0,1],[1,2],[2,1],[3,2],[4,1]],[[0,0],[1,0],[2,0],[3,1],[4,2]],
  [[0,2],[1,2],[2,2],[3,1],[4,0]],[[0,0],[1,1],[2,2],[3,2],[4,2]],[[0,2],[1,1],[2,0],[3,0],[4,0]]
];
const LINE_COLORS=['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0ff','#5856d6','#af52de','#ff2d95','#ff6b6b','#ffd93d','#6bcf7f','#4ecdc4','#95e1d3','#a8e6cf','#c7ceea','#e2a4d1','#f6d365','#b5eaea','#e0aaff','#ffb4a2'];
const POOL=[];Object.entries(WEIGHTS).forEach(([s,w])=>{for(let i=0;i<w;i++)POOL.push(s)});

let state={balance:50000,betPerLine:1,lines:21,lang:'ru',sound:true};
let isSpinning=false, stopRequested=false;

const reelsEl=document.getElementById('reels');
const tracks=[]; const flashes=[];

function $(id){return document.getElementById(id)}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')}
function save(){try{localStorage.setItem('forest_v2',JSON.stringify(state))}catch(e){}}
function load(){try{const r=localStorage.getItem('forest_v2');if(r)Object.assign(state,JSON.parse(r))}catch(e){}}
function totalBet(){return state.lines*state.betPerLine}
function closeModal(id){ $(id).classList.remove('active'); }
function notif(msg,type=''){ const n=$('notif'); n.textContent=msg; n.className='notif show '+type; clearTimeout(n._t); n._t=setTimeout(()=>{n.className='notif '+type},2400); }
window.setLang = (l) => { state.lang = l; save(); notif(l.toUpperCase() + ' язык выбран'); }

function randSym(){return POOL[Math.floor(Math.random()*POOL.length)]}

function buildReels(){
  reelsEl.innerHTML=''; tracks.length=0; flashes.length=0;
  // Высота ячейки рассчитывается относительно высоты контейнера
  const frameHeight = document.querySelector('.reels-frame').clientHeight;
  const cellH = frameHeight / 3;

  for(let r=0;r<REELS;r++){
    const reel=document.createElement('div'); reel.className='reel';
    const track=document.createElement('div'); track.className='track';
    track.innerHTML=Array.from({length:ROWS},()=>`<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`).join('');
    const flash=document.createElement('div'); flash.className='reel-flash';
    reel.appendChild(track); reel.appendChild(flash); reelsEl.appendChild(reel); tracks.push(track); flashes.push(flash);
  }
}

let reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

function startReelSpin(r, cellH) {
  const track = tracks[r]; let html = ''; 
  for (let i = 0; i < 40; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
  track.innerHTML = html; let lastTime = performance.now(); const speed = 2000;
  
  function frame(now) {
    if (!isSpinning) return; const dt = (now - lastTime) / 1000; lastTime = now;
    reelPositions[r] -= speed * dt; 
    if (reelPositions[r] <= -(20 * cellH)) reelPositions[r] += 20 * cellH;
    track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
    reelAnimFrames[r] = requestAnimationFrame(frame);
  }
  reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final3, cellH) {
  return new Promise(resolve => {
    setTimeout(() => {
      cancelAnimationFrame(reelAnimFrames[r]); const track = tracks[r]; const currentY = reelPositions[r];
      let html = ''; 
      for (let i = 0; i < 15; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
      final3.forEach(s => html += `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`);
      for (let i = 0; i < 5; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
      
      track.innerHTML = html; let startY = currentY % (15 * cellH); if(startY > 0) startY -= 15 * cellH;
      track.style.transition = 'none'; track.style.transform = `translate3d(0, ${startY}px, 0)`; track.getBoundingClientRect();
      
      let targetY = -15 * cellH; const dur = 800 + r * 200; 
      track.style.transition = `transform ${dur}ms cubic-bezier(0.1, 0.8, 0.2, 1)`; 
      track.style.transform = `translate3d(0, ${targetY}px, 0)`;
      
      setTimeout(() => {
        track.style.transition = 'none'; track.style.transform = 'translate3d(0,0,0)'; 
        track.innerHTML = final3.map(s => `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`).join('');
        try { flashes[r].classList.add('flash'); setTimeout(()=>flashes[r].classList.remove('flash'), 100); } catch(e) {}
        resolve();
      }, dur + 50);
    }, r * 200);
  });
}

function genGrid(){
  const g=[];
  for(let r=0;r<REELS;r++){ const col=[]; for(let row=0;row<ROWS;row++) col.push(randSym()); g.push(col); }
  return g;
}

function calcWins(grid,perLine){
  const wins=[]; let total=0;
  PAYLINES.slice(0, state.lines).forEach((line,idx)=>{
    const syms=line.map(([r,row])=>grid[r][row]); 
    const firstSym = syms[0];
    if (firstSym === 'mushroom.png') return;
    let count = 1; let currentSym = firstSym;
    for(let i=1;i<REELS;i++){
      if (syms[i] === currentSym || syms[i] === 'gem.png') { count++; } else { break; }
    }
    if(count>=3){
      const mult=PAYTABLE[firstSym][count-3];
      if(mult>0){ total+=mult*perLine; wins.push({idx,line,count}); }
    }
  });
  return {total, wins};
}

function refreshUI(){
  $('balanceVal').textContent = fmt(state.balance); 
  $('betVal').textContent = fmt(state.betPerLine); 
  $('totalBetVal').textContent = fmt(totalBet()); 
  $('linesVal').textContent = state.lines;
  
  if(!isSpinning) $('winVal').textContent = '0';
}

async function startSpinAction() {
  if (isSpinning) return;
  const bet = totalBet();
  if (state.balance < bet) { notif('Недостаточно монет','error'); return; }
  
  state.balance -= bet; $('winVal').textContent = '0';
  isSpinning = true; stopRequested = false;
  save(); refreshUI();
  
  const frameHeight = document.querySelector('.reels-frame').clientHeight;
  const cellH = frameHeight / 3;

  reelPositions = [0, 0, 0, 0, 0]; 
  tracks.forEach((tr, i) => startReelSpin(i, cellH));
  
  // Автостоп через 3 секунды, если игрок не нажал СТОП
  setTimeout(() => { if(isSpinning) requestStop(); }, 3000);
}

async function requestStop() {
  if (!isSpinning || stopRequested) return; 
  stopRequested = true;
  
  const bet = totalBet(); const perLine = state.betPerLine; 
  const finalGrid = genGrid();
  const frameHeight = document.querySelector('.reels-frame').clientHeight;
  const cellH = frameHeight / 3;

  await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i], cellH)));
  
  const {total, wins} = calcWins(finalGrid, perLine);
  
  if (total > 0) {
    state.balance += total; 
    $('winVal').textContent = fmt(total);
    notif('Выигрыш: +' + fmt(total) + ' 🪙', 'gold');
    $('bigWinAmount').textContent = '+' + fmt(total) + ' 🪙';
    $('bigWinOverlay').classList.add('active');
    setTimeout(() => { $('bigWinOverlay').classList.remove('active'); }, 2000);
  } else {
    notif('Повезет в следующий раз!', 'error');
  }
  
  isSpinning = false; save(); refreshUI();
}

function bind(){
  $('startSound').onclick = () => { state.sound=true; save(); $('startOverlay').classList.add('hidden'); };
  $('startMute').onclick = () => { state.sound=false; save(); $('startOverlay').classList.add('hidden'); };

  $('spinBtn').onclick = () => { if (isSpinning) requestStop(); else startSpinAction(); };
  $('linesDec').onclick = () => { if(!isSpinning){ state.lines = Math.max(1, state.lines-1); save(); refreshUI(); } };
  $('linesInc').onclick = () => { if(!isSpinning){ state.lines = Math.min(MAX_LINES, state.lines+1); save(); refreshUI(); } };
  $('betDec').onclick = () => { if(!isSpinning){ state.betPerLine = Math.max(1, state.betPerLine-1); save(); refreshUI(); } };
  $('betInc').onclick = () => { if(!isSpinning){ state.betPerLine += 1; save(); refreshUI(); } };
  
  // Заглушки для остальных кнопок, чтобы открывались модалки
  $('wheelBtn').onclick = () => $('wheelModal').classList.add('active');
  $('shopBtn').onclick = () => $('shopModal').classList.add('active');
  $('riskBtn').onclick = () => $('riskModal').classList.add('active');
  $('tasksBtn').onclick = () => $('tasksModal').classList.add('active');
  $('topBtn').onclick = () => $('topModal').classList.add('active');
  $('bonusBtn').onclick = () => notif('Бонус получен!');
  $('paytableBtn').onclick = () => $('paytableModal').classList.add('active');
  $('autoBtn').onclick = () => notif('Автоспин включен');
  
  document.querySelectorAll('.modal').forEach(m=>{ m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('active'); }); });
}

// Инициализация
window.addEventListener('resize', () => { if(!isSpinning) buildReels(); });
load(); buildReels(); bind(); refreshUI();
</script>
</body>
</html>
