<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune 5x5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#f0f4f8;--gold:#ffd966;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;height:100dvh;}

/* Главный контейнер */
.app {
    position: relative;
    width: 100vw;
    height: 100dvh;
    background: url('bg.png?v=35') no-repeat center center;
    background-size: 100% 100%; 
    overflow: hidden;
}

/* ---------------- ДИНАМИЧЕСКИЙ ТЕКСТ (Точно по центру плашек) ---------------- */
.ui-text {
    position: absolute; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-weight: 900; 
    text-shadow: 1px 1px 2px #000, 0 0 5px #000;
}

/* Верхний баланс и выигрыш */
.ui-balance { top: 21%; left: 15%; width: 25%; height: 3%; font-size: 2vh; }
.ui-win { top: 21%; right: 15%; width: 25%; height: 3%; font-size: 2vh; }

/* Нижние цифры (Линии, Ставка, Всего) - опущены вниз */
.ui-lines { bottom: 28%; left: 11%; width: 18%; height: 3%; font-size: 1.8vh; }
.ui-bet { bottom: 28%; left: 41%; width: 18%; height: 3%; font-size: 1.8vh; }
.ui-total { bottom: 28%; right: 11%; width: 18%; height: 3%; font-size: 1.8vh; }

/* Текст на большой зеленой кнопке */
.ui-spin-text { bottom: 22%; left: 35%; width: 30%; height: 5%; font-size: 2.5vh; color: #fff; text-shadow: 0 2px 4px #000; }

/* ---------------- СЕТКА БАРАБАНОВ 5x5 ---------------- */
.reels-frame {
    position: absolute;
    top: 25.5%;    
    left: 11.5%;   
    right: 11.5%;  
    height: 45%; /* Фиксированная высота, чтобы не съезжало */
    background: #0d2112; /* Глухой фон, чтобы скрыть нарисованных зверей */
    border-radius: 4px;
    overflow: hidden;
    z-index: 10;
    border: 2px solid #3a2311; 
    box-shadow: inset 0 0 20px #000;
}
.reels { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 1px; height: 100%; width: 100%; background: #000; }
.reel { background: #0d2112; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.track { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; }
.cell { display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; width: 100%; } 
.cell img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5)) drop-shadow(0 2px 2px rgba(0,0,0,0.8)); }
.cell.win::before { content: ""; position: absolute; inset: 2px; border: 2px solid #a8ff78; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,113,.6), transparent 70%); box-shadow: 0 0 15px #2ecc71; animation: winPulse .4s infinite alternate; }
@keyframes winPulse { 0%{transform:scale(.9)} 100%{transform:scale(1.1)} }

/* ---------------- НЕВИДИМЫЕ КНОПКИ ---------------- */
.btn-overlay { 
    position: absolute; 
    z-index: 99; /* Самый высокий приоритет для кликов */
    cursor: pointer; 
    border-radius: 10px; 
}
.btn-overlay:active { background: rgba(255,255,255,0.2); box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }

/* Главные кнопки */
.btn-spin { bottom: 21.5%; left: 35%; width: 30%; height: 7%; border-radius: 20px; }
.btn-auto { bottom: 22.5%; right: 8.5%; width: 15%; height: 5.5%; }

/* Стрелки линий и ставки */
.btn-lines-dec { bottom: 28%; left: 7%; width: 4%; height: 3%; }
.btn-lines-inc { bottom: 28%; left: 26%; width: 4%; height: 3%; }
.btn-bet-dec { bottom: 28%; left: 37%; width: 4%; height: 3%; }
.btn-bet-inc { bottom: 28%; left: 56%; width: 4%; height: 3%; }

/* Кнопки 1, 3, 5, 9, 15, 21 */
.btn-l1 { bottom: 28%; left: 10.5%; width: 3.5%; height: 3%; }
.btn-l3 { bottom: 28%; left: 15%; width: 3.5%; height: 3%; }
.btn-l5 { bottom: 28%; left: 19.5%; width: 3.5%; height: 3%; }
.btn-l9 { bottom: 28%; left: 24%; width: 3.5%; height: 3%; }
.btn-l15 { bottom: 28%; left: 28.5%; width: 3.5%; height: 3%; }
.btn-l21 { bottom: 28%; left: 33%; width: 3.5%; height: 3%; }

/* Нижние кнопки меню */
.btn-action { bottom: 13%; width: 11%; height: 5%; }
.btn-wheel { left: 1.5%; }
.btn-shop { left: 14%; }
.btn-risk { left: 26.5%; }
.btn-friends { left: 39%; }
.btn-tasks { right: 39%; }
.btn-top { right: 26.5%; }
.btn-bonus { right: 14%; }
.btn-rules { right: 1.5%; }

/* Уведомления */
.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:800;box-shadow:0 5px 15px rgba(0,0,0,.5);transition:top .3s;z-index:999;text-align:center}
.notif.show{top:15px}
.notif.error{background:#e74c3c}
.notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
</style>
</head>
<body>

<div class="app" id="gameArea">
    <!-- Тексты -->
    <div class="ui-text ui-balance" id="balanceVal">50 000</div>
    <div class="ui-text ui-win" id="winVal">0</div>
    <div class="ui-text ui-lines" id="linesVal">21</div>
    <div class="ui-text ui-bet" id="betVal">1</div>
    <div class="ui-text ui-total" id="totalBetVal">21</div>
    
    <!-- Текст на зеленой кнопке -->
    <div class="ui-text ui-spin-text" id="spinText">КРУТИТЬ</div>

    <!-- Сетка -->
    <div class="reels-frame" id="reelsFrame">
        <div class="reels" id="reels"></div>
    </div>

    <!-- Кнопки -->
    <div class="btn-overlay btn-spin" id="spinBtn"></div>
    <div class="btn-overlay btn-auto" id="autoBtn"></div>
    
    <!-- Стрелки +/- Линии -->
    <div class="btn-overlay btn-lines-dec" id="linesDec"></div>
    <div class="btn-overlay btn-lines-inc" id="linesInc"></div>
    <!-- Стрелки +/- Ставка -->
    <div class="btn-overlay btn-bet-dec" id="betDec"></div>
    <div class="btn-overlay btn-bet-inc" id="betInc"></div>

    <!-- Кнопки быстрой ставки -->
    <div class="btn-overlay btn-l1" onclick="setLines(1)"></div>
    <div class="btn-overlay btn-l3" onclick="setLines(3)"></div>
    <div class="btn-overlay btn-l5" onclick="setLines(5)"></div>
    <div class="btn-overlay btn-l9" onclick="setLines(9)"></div>
    <div class="btn-overlay btn-l15" onclick="setLines(15)"></div>
    <div class="btn-overlay btn-l21" onclick="setLines(21)"></div>

    <!-- Нижнее меню -->
    <div class="btn-overlay btn-action btn-wheel" onclick="notif('Колесо')"></div>
    <div class="btn-overlay btn-action btn-shop" onclick="notif('Магазин')"></div>
    <div class="btn-overlay btn-action btn-risk" onclick="notif('Риск')"></div>
    <div class="btn-overlay btn-action btn-friends" onclick="notif('Друзья')"></div>
    <div class="btn-overlay btn-action btn-tasks" onclick="notif('Задания')"></div>
    <div class="btn-overlay btn-action btn-top" onclick="notif('Рейтинг')"></div>
    <div class="btn-overlay btn-action btn-bonus" onclick="notif('Бонус')"></div>
    <div class="btn-overlay btn-action btn-rules" onclick="notif('Правила')"></div>
</div>

<div class="notif" id="notif"></div>

<script>
const REELS = 5, ROWS = 5; 
const IMG_VER = '?v=35';

// Символы (Убедись, что эти файлы есть в твоей папке!)
const SYMBOLS = ['gem.png', 'mushroom.png', 'hedgehog.png', 'acorn.png', 'leaf.png', 'coin.png'];
const WEIGHTS = {'gem.png':5, 'mushroom.png':10, 'hedgehog.png':15, 'acorn.png':25, 'leaf.png':25, 'coin.png':30};

const PAYTABLE = {
    'gem.png': [15, 60, 250],
    'mushroom.png': [10, 40, 150],
    'hedgehog.png': [8, 25, 80],
    'acorn.png': [5, 15, 50],
    'leaf.png': [5, 15, 50],
    'coin.png': [2, 5, 15]
};

// Классические линии, адаптированные под 5x5 (от 0 до 4)
const PAYLINES = [
    [[0,0],[1,0],[2,0],[3,0],[4,0]], [[0,1],[1,1],[2,1],[3,1],[4,1]], [[0,2],[1,2],[2,2],[3,2],[4,2]], [[0,3],[1,3],[2,3],[3,3],[4,3]], [[0,4],[1,4],[2,4],[3,4],[4,4]],
    [[0,0],[1,1],[2,2],[3,1],[4,0]], [[0,4],[1,3],[2,2],[3,3],[4,4]], [[0,1],[1,2],[2,3],[3,2],[4,1]], [[0,3],[1,2],[2,1],[3,2],[4,3]],
    [[0,0],[1,0],[2,1],[3,2],[4,2]], [[0,4],[1,4],[2,3],[3,2],[4,2]], [[0,2],[1,1],[2,0],[3,1],[4,2]], [[0,2],[1,3],[2,4],[3,3],[4,2]],
    [[0,1],[1,0],[2,0],[3,0],[4,1]], [[0,3],[1,4],[2,4],[3,4],[4,3]], [[0,0],[1,1],[2,1],[3,1],[4,0]], [[0,4],[1,3],[2,3],[3,3],[4,4]],
    [[0,1],[1,1],[2,2],[3,3],[4,3]], [[0,3],[1,3],[2,2],[3,1],[4,1]], [[0,0],[1,2],[2,4],[3,2],[4,0]], [[0,4],[1,2],[2,0],[3,2],[4,4]]
];

const LINE_COLORS=['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0ff','#5856d6','#af52de','#ff2d95','#ff6b6b','#ffd93d','#6bcf7f','#4ecdc4','#95e1d3','#a8e6cf','#c7ceea','#e2a4d1','#f6d365','#b5eaea','#e0aaff','#ffb4a2'];
const POOL=[];Object.entries(WEIGHTS).forEach(([s,w])=>{for(let i=0;i<w;i++)POOL.push(s)});

let state = { balance: 50000, betPerLine: 1, lines: 21 };
let isSpinning = false, stopRequested = false;
let cellH = 0;

const reelsEl = document.getElementById('reels');
const tracks = [];

function $(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
function notif(msg, type='') { const n=$('notif'); n.textContent=msg; n.className='notif show '+type; clearTimeout(n._t); n._t=setTimeout(()=>{n.className='notif '+type}, 2400); }
function randSym() { return POOL[Math.floor(Math.random()*POOL.length)]; }
function totalBet() { return state.lines * state.betPerLine; }

// Глобальная функция для кнопок 1,3,5...
window.setLines = function(num) {
    if(isSpinning) return;
    state.lines = num;
    updateUI();
    notif('Активных линий: ' + num);
};

// Сборка сетки
function buildReels() {
    reelsEl.innerHTML = ''; tracks.length = 0;
    const frameHeight = document.querySelector('.reels-frame').clientHeight;
    // ЖЕСТКО делим высоту на 5, округляя вниз, чтобы не было багов
    cellH = Math.floor(frameHeight / ROWS);

    for (let r = 0; r < REELS; r++) {
        const reel = document.createElement('div'); 
        reel.className = 'reel';
        const track = document.createElement('div'); 
        track.className = 'track';
        
        let html = '';
        for (let row = 0; row < ROWS; row++) {
            html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
        }
        track.innerHTML = html;
        reel.appendChild(track); 
        reelsEl.appendChild(reel); 
        tracks.push(track);
    }
    updateUI();
}

function genGrid() {
    const g = [];
    for (let r = 0; r < REELS; r++) {
        const col = [];
        for (let row = 0; row < ROWS; row++) col.push(randSym());
        g.push(col);
    }
    return g;
}

function renderGrid(grid) {
    for (let r = 0; r < REELS; r++) {
        let html = '';
        for (let row = 0; row < ROWS; row++) {
            html += `<div class="cell" style="height:${cellH}px"><img src="${grid[r][row]}${IMG_VER}"></div>`;
        }
        tracks[r].innerHTML = html;
    }
}

// Анимация прокрутки (Покадровая)
let reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

function startReelSpin(r) {
    const track = tracks[r]; 
    let html = ''; 
    for (let i = 0; i < 40; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
    track.innerHTML = html; 
    let lastTime = performance.now(); 
    const speed = 2000;
  
    function frame(now) {
        if (!isSpinning) return; 
        const dt = (now - lastTime) / 1000; lastTime = now;
        reelPositions[r] -= speed * dt; 
        if (reelPositions[r] <= -(20 * cellH)) reelPositions[r] += 20 * cellH;
        track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
        reelAnimFrames[r] = requestAnimationFrame(frame);
    }
    reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final5) {
    return new Promise(resolve => {
        setTimeout(() => {
            cancelAnimationFrame(reelAnimFrames[r]); 
            const track = tracks[r]; const currentY = reelPositions[r];
            let html = ''; 
            for (let i = 0; i < 15; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
            final5.forEach(s => html += `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`);
            for (let i = 0; i < 5; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
      
            track.innerHTML = html; 
            let startY = currentY % (15 * cellH); 
            if(startY > 0) startY -= 15 * cellH;
            track.style.transition = 'none'; track.style.transform = `translate3d(0, ${startY}px, 0)`; 
            track.getBoundingClientRect();
      
            let targetY = -15 * cellH; const dur = 800 + r * 200; 
            track.style.transition = `transform ${dur}ms cubic-bezier(0.1, 0.8, 0.2, 1)`; 
            track.style.transform = `translate3d(0, ${targetY}px, 0)`;
      
            setTimeout(() => {
                track.style.transition = 'none'; track.style.transform = 'translate3d(0,0,0)'; 
                track.innerHTML = final5.map(s => `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`).join('');
                resolve();
            }, dur + 50);
        }, r * 200);
    });
}

// Подсчет выигрышей
function calcWins(grid, perLine) {
    const wins = []; let total = 0;
    PAYLINES.slice(0, state.lines).forEach((line,idx)=>{
        const syms = line.map(([r,row])=>grid[r][row]); 
        const firstSym = syms[0];
        if (firstSym === 'mushroom.png') return; 

        let count = 1; let currentSym = firstSym;
        for(let i=1;i<REELS;i++){
            if (syms[i] === currentSym || syms[i] === 'gem.png') { count++; } else { break; }
        }
        if(count>=3){
            const mult = PAYTABLE[firstSym][count-3];
            if(mult>0){ total+=mult*perLine; wins.push({idx,line,count}); }
        }
    });
    return {total, wins};
}

// Обновление интерфейса
function updateUI() {
    $('balanceVal').textContent = fmt(state.balance); 
    $('betVal').textContent = fmt(state.betPerLine); 
    $('linesVal').textContent = state.lines;
    $('totalBetVal').textContent = fmt(totalBet());
    if(!isSpinning) $('winVal').textContent = '0';
}

// Запуск спина
async function startSpin() {
    if (isSpinning) return;
    if (state.balance < totalBet()) { notif('Мало монет!', 'error'); return; }
    
    state.balance -= totalBet();
    isSpinning = true; stopRequested = false;
    $('winVal').textContent = '0';
    updateUI();
    $('spinText').textContent = 'СТОП';

    const finalGrid = genGrid();
    reelPositions = [0, 0, 0, 0, 0]; 
    tracks.forEach((tr, i) => startReelSpin(i));

    // Автоматическая остановка через 2 секунды (или по клику)
    setTimeout(() => {
        if(!stopRequested) requestStop(finalGrid);
    }, 1500);
}

// Остановка барабанов и подсчет
async function requestStop(pregeneratedGrid) {
    if (!isSpinning || stopRequested) return; 
    stopRequested = true;
    
    const perLine = state.betPerLine; 
    const finalGrid = pregeneratedGrid || genGrid();

    await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i])));
    
    const {total, wins} = calcWins(finalGrid, perLine);
    
    if (total > 0) {
        state.balance += total; 
        $('winVal').textContent = fmt(total);
        notif('Выигрыш: +' + fmt(total) + ' 🪙', 'gold');
    } else {
        notif('Повезет в следующий раз!', 'error');
    }
    
    isSpinning = false; 
    $('spinText').textContent = 'КРУТИТЬ';
    updateUI();
}

// Привязка кликов
$('spinBtn').onclick = () => { 
    if (isSpinning) {
        // Если уже крутится, останавливаем принудительно
        requestStop(); 
    } else {
        startSpin(); 
    }
};

$('linesDec').onclick = () => { if(!isSpinning){ state.lines = Math.max(1, state.lines-1); updateUI(); } };
$('linesInc').onclick = () => { if(!isSpinning){ state.lines = Math.min(21, state.lines+1); updateUI(); } };
$('betDec').onclick = () => { if(!isSpinning){ state.betPerLine = Math.max(1, state.betPerLine-1); updateUI(); } };
$('betInc').onclick = () => { if(!isSpinning){ state.betPerLine += 1; updateUI(); } };

// Запуск после загрузки
window.addEventListener('resize', () => { if(!isSpinning) buildReels(); });
setTimeout(buildReels, 200);
</script>
</body>
</html>
