<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#d4af37;--goldL:#ffd966;--green:#2ecc71;--text:#f0f4f8;--muted:#8899aa}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;}

/* Игровое поле с твоим фоном */
.game-container {
    position: relative;
    width: 100vw;
    max-width: 100vh; /* Ограничиваем ширину, чтобы на планшетах не растягивалось */
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

.machine-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('bg.png.PNG?v=14') no-repeat center center;
    background-size: cover; /* Картинка заполняет экран, даже если обрежется по краям */
    z-index: 1;
}

/* Затемнение по краям для читаемости кнопок */
.ui-overlay {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    padding: 10px 5px;
}

/* Верхняя панель (Баланс и Выигрыш) */
.top-stats {
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    margin-top: 2vh;
}
.stat-box {
    background: rgba(20, 10, 5, 0.8);
    border: 2px solid #5c3a21;
    border-radius: 10px;
    padding: 4px 12px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    min-width: 100px;
}
.stat-box .lbl { font-size: 10px; color: #8899aa; text-transform: uppercase; font-weight: 700; }
.stat-box .val { font-size: 16px; font-weight: 900; color: #ffd966; text-shadow: 1px 1px 2px #000; }

/* Сетка барабанов */
.reels-frame {
    position: absolute;
    top: 16%; left: 16%; right: 16%; bottom: 30%;
    background: transparent;
    overflow: hidden;
    z-index: 4;
}
.reels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; height: 100%; }
.reel { background: transparent; height: 100%; overflow: hidden; position: relative; }
.reel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 20px; background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); z-index: 3; pointer-events: none; }
.reel::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent); z-index: 3; pointer-events: none; }
.track { position: absolute; left: 0; right: 0; top: 0; transform: translate3d(0,0,0); will-change: transform; }
.cell { display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; } 
.cell img { width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6)) drop-shadow(0 2px 4px rgba(0,0,0,0.9)); }
.cell.win::before { content: ""; position: absolute; inset: 2px; border: 2px solid #a8ff78; border-radius: 6px; background: radial-gradient(circle, rgba(46,204,113,.5), transparent 70%); pointer-events: none; box-shadow: 0 0 15px rgba(46,204,113,1); animation: winPulse .5s infinite alternate; }
@keyframes winPulse { 0%{transform:scale(.95)} 100%{transform:scale(1.05)} }

/* НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ */
.bottom-panel {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 2vh;
}

/* Блок с линиями и ставкой */
.controls-row {
    display: flex;
    justify-content: space-between;
    background: rgba(20, 10, 5, 0.85);
    border: 2px solid #5c3a21;
    border-radius: 10px;
    padding: 6px;
    margin: 0 5px;
}
.control-group { display: flex; align-items: center; gap: 4px; }
.control-group button {
    background: linear-gradient(180deg, #2a4a2a, #1a2e1a);
    border: 1px solid #5c3a21; color: #fff;
    width: 28px; height: 28px; border-radius: 6px;
    font-weight: 900; cursor: pointer;
}
.control-group .val { font-size: 14px; color: #ffd966; font-weight: 900; width: 30px; text-align: center; }

/* Кнопки SPIN и AUTO */
.action-row {
    display: flex;
    gap: 8px;
    padding: 0 5px;
}
.btn-spin {
    flex: 2;
    background: linear-gradient(180deg, #2ecc71, #1a7d43);
    border: 2px solid #a8ff78;
    color: #fff; font-size: 20px; font-weight: 900;
    padding: 12px; border-radius: 10px;
    box-shadow: 0 4px 0 #0f3d22, 0 6px 10px rgba(0,0,0,.5);
    cursor: pointer; text-shadow: 1px 1px 2px #000;
}
.btn-spin:active { transform: translateY(3px); box-shadow: none; }
.btn-auto {
    flex: 1;
    background: linear-gradient(180deg, #3498db, #1a5f8a);
    border: 2px solid #5dade2;
    color: #fff; font-size: 16px; font-weight: 900;
    border-radius: 10px; padding: 8px;
    box-shadow: 0 4px 0 #0f3d54, 0 6px 10px rgba(0,0,0,.5);
    cursor: pointer;
}

/* Сетка из 8 кнопок */
.buttons-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 0 5px;
}
.btn-menu {
    background: linear-gradient(180deg, #3e2723, #1e110b);
    border: 2px solid #8d6e63;
    border-radius: 8px;
    color: #fff;
    padding: 8px 2px;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    box-shadow: 0 3px 0 #0a0502;
}
.btn-menu:active { transform: translateY(2px); box-shadow: none; }
.btn-menu .ico { font-size: 16px; }
/* Цвета для кнопок */
.btn-menu.wheel { background: linear-gradient(180deg, #f39c12, #d35400); border-color: #ffb84d; }
.btn-menu.shop { background: linear-gradient(180deg, #8e44ad, #5b2c6f); border-color: #af7ac5; }
.btn-menu.risk { background: linear-gradient(180deg, #e74c3c, #922b21); border-color: #ff8a7a; }
.btn-menu.friends { background: linear-gradient(180deg, #9b59b6, #6c3483); border-color: #af7ac5; }
.btn-menu.tasks { background: linear-gradient(180deg, #3498db, #1a5f8a); border-color: #5dade2; }
.btn-menu.top { background: linear-gradient(180deg, #f1c40f, #b8860b); border-color: #ffe9a0; color: #1a1200;}
.btn-menu.bonus { background: linear-gradient(180deg, #2ecc71, #1a7d43); border-color: #58e896; }
.btn-menu.rules { background: linear-gradient(180deg, #7f8c8d, #576574); border-color: #bdc3c7; }

/* Модалки и уведомления */
.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:800;box-shadow:0 5px 15px rgba(0,0,0,.5);transition:top .3s;z-index:999;text-align:center}
.notif.show{top:15px}
.notif.error{background:#e74c3c}
.notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal.active{opacity:1;pointer-events:auto}
.modal-box{background:#1a2e1a;border:2px solid #d4af37;border-radius:14px;padding:16px;max-width:380px;width:90%;text-align:center;color:#fff}
.modal-close{background:#576574;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:800;margin-top:10px;width:100%}
</style>
</head>
<body>

<div class="game-container">
    <div class="machine-bg"></div>
    
    <div class="ui-overlay">
        <!-- Верхняя панель -->
        <div class="top-stats">
            <div class="stat-box">
                <div class="lbl">БАЛАНС</div>
                <div class="val" id="balanceVal">50 000</div>
            </div>
            <div class="stat-box">
                <div class="lbl">ВЫИГРЫШ</div>
                <div class="val" id="winVal">0</div>
            </div>
        </div>

        <!-- Барабаны -->
        <div class="reels-frame">
            <div class="reels" id="reels"></div>
        </div>

        <!-- Панель управления -->
        <div class="bottom-panel">
            <div class="controls-row">
                <div class="control-group">
                    <span style="font-size:10px;color:#8899aa;">ЛИНИИ</span>
                    <button id="linesDec">-</button>
                    <span class="val" id="linesVal">21</span>
                    <button id="linesInc">+</button>
                </div>
                <div class="control-group">
                    <span style="font-size:10px;color:#8899aa;">СТАВКА</span>
                    <button id="betDec">-</button>
                    <span class="val" id="betVal">1</span>
                    <button id="betInc">+</button>
                </div>
            </div>

            <div class="action-row">
                <button class="btn-spin" id="spinBtn">SPIN</button>
                <button class="btn-auto" id="autoBtn">AUTO<br><span style="font-size:10px;">10x</span></button>
            </div>

            <!-- 8 Кнопок в один ряд (сетка 4х2) -->
            <div class="buttons-grid">
                <button class="btn-menu wheel" onclick="openModal('wheelModal')"><span class="ico">🎡</span>Колесо</button>
                <button class="btn-menu shop" onclick="openModal('shopModal')"><span class="ico">⭐</span>Магазин</button>
                <button class="btn-menu risk" onclick="openModal('riskModal')"><span class="ico">🃏</span>Риск</button>
                <button class="btn-menu friends" onclick="openModal('friendsModal')"><span class="ico">🤝</span>Друзья</button>
                <button class="btn-menu tasks" onclick="openModal('tasksModal')"><span class="ico">📜</span>Задания</button>
                <button class="btn-menu top" onclick="openModal('topModal')"><span class="ico">🏆</span>ТОП</button>
                <button class="btn-menu bonus" onclick="notif('Бонус получен!')"><span class="ico">🎁</span>Бонус</button>
                <button class="btn-menu rules" onclick="openModal('rulesModal')"><span class="ico">📋</span>Правила</button>
            </div>
        </div>
    </div>
</div>

<!-- Модалки -->
<div class="modal" id="wheelModal"><div class="modal-box"><h2>🎡 Колесо</h2><button class="modal-close" onclick="closeModal('wheelModal')">Закрыть</button></div></div>
<div class="modal" id="shopModal"><div class="modal-box"><h2>⭐ Магазин</h2><button class="modal-close" onclick="closeModal('shopModal')">Закрыть</button></div></div>
<div class="modal" id="riskModal"><div class="modal-box"><h2>🃏 Риск</h2><button class="modal-close" onclick="closeModal('riskModal')">Закрыть</button></div></div>
<div class="modal" id="friendsModal"><div class="modal-box"><h2>🤝 Друзья</h2><button class="modal-close" onclick="closeModal('friendsModal')">Закрыть</button></div></div>
<div class="modal" id="tasksModal"><div class="modal-box"><h2>📜 Задания</h2><button class="modal-close" onclick="closeModal('tasksModal')">Закрыть</button></div></div>
<div class="modal" id="topModal"><div class="modal-box"><h2>🏆 ТОП</h2><button class="modal-close" onclick="closeModal('topModal')">Закрыть</button></div></div>
<div class="modal" id="rulesModal"><div class="modal-box"><h2>📋 Правила</h2><button class="modal-close" onclick="closeModal('rulesModal')">Закрыть</button></div></div>

<div class="notif" id="notif"></div>

<script>
// ЛОГИКА ИГРЫ
const REELS=5, ROWS=3, MAX_LINES=21;
const IMG_VER = '?v=14';
const SYMBOLS=['gem.png','mushroom.png','hedgehog.png','acorn.png','leaf.png','coin.png'];
const WEIGHTS={'gem.png':5,'mushroom.png':10,'hedgehog.png':15,'acorn.png':25,'leaf.png':25,'coin.png':40};
const PAYTABLE={'gem.png':[15,60,250],'mushroom.png':[10,40,150],'hedgehog.png':[8,25,80],'acorn.png':[5,15,50],'leaf.png':[5,15,50],'coin.png':[2,5,15]};
const PAYLINES=[
  [[0,0],[1,0],[2,0],[3,0],[4,0]],[[0,1],[1,1],[2,1],[3,1],[4,1]],[[0,2],[1,2],[2,2],[3,2],[4,2]],
  [[0,0],[1,1],[2,2],[3,1],[4,0]],[[0,2],[1,1],[2,0],[3,1],[4,2]],[[0,0],[1,0],[2,1],[3,2],[4,2]],
  [[0,2],[1,2],[2,1],[3,0],[4,0]],[[0,1],[1,0],[2,0],[3,0],[4,1]],[[0,1],[1,2],[2,2],[3,2],[4,1]],
  [[0,0],[1,1],[2,0],[3,1],[4,0]],[[0,2],[1,1],[2,2],[3,1],[4,2]],[[0,0],[1,2],[2,0],[3,2],[4,0]],
  [[0,2],[1,0],[2,2],[3,0],[4,2]],[[0,0],[1,1],[2,1],[3,1],[4,0]],[[0,2],[1,1],[2,1],[3,1],[4,2]],
  [[0,1],[1,0],[2,1],[3,0],[4,1]],[[0,1],[1,2],[2,1],[3,2],[4,1]],[[0,0],[1,0],[2,0],[3,1],[4,2]],
  [[0,2],[1,2],[2,2],[3,1],[4,0]],[[0,0],[1,1],[2,2],[3,2],[4,2]],[[0,2],[1,1],[2,0],[3,0],[4,0]]
];
const POOL=[];Object.entries(WEIGHTS).forEach(([s,w])=>{for(let i=0;i<w;i++)POOL.push(s)});

let state={balance:50000,betPerLine:1,lines:21};
let isSpinning=false, stopRequested=false;

const reelsEl=document.getElementById('reels');
const tracks=[];

function $(id){return document.getElementById(id)}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')}
function notif(msg,type=''){ const n=$('notif'); n.textContent=msg; n.className='notif show '+type; clearTimeout(n._t); n._t=setTimeout(()=>{n.className='notif '+type},2400); }
function openModal(id) { $(id).classList.add('active'); }
function closeModal(id) { $(id).classList.remove('active'); }
function totalBet(){return state.lines*state.betPerLine}
function randSym(){return POOL[Math.floor(Math.random()*POOL.length)]}

function buildReels(){
  reelsEl.innerHTML=''; tracks.length=0;
  const frameHeight = document.querySelector('.reels-frame').clientHeight;
  const cellH = frameHeight / 3;

  for(let r=0;r<REELS;r++){
    const reel=document.createElement('div'); reel.className='reel';
    const track=document.createElement('div'); track.className='track';
    track.innerHTML=Array.from({length:ROWS},()=>`<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`).join('');
    reel.appendChild(track); reelsEl.appendChild(reel); tracks.push(track);
  }
}

let reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

function startReelSpin(r, cellH) {
  const track = tracks[r]; let html = ''; 
  for (let i = 0; i < 40; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
  track.innerHTML = html; let lastTime = performance.now(); const speed = 2000;
  
  function frame(now) {
    if (!isSpinning) return; const dt = (now - lastTime) / 1000; lastTime = now;
    reelPositions[r] -= speed * dt; 
    if (reelPositions[r] <= -(20 * cellH)) reelPositions[r] += 20 * cellH;
    track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
    reelAnimFrames[r] = requestAnimationFrame(frame);
  }
  reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final3, cellH) {
  return new Promise(resolve => {
    setTimeout(() => {
      cancelAnimationFrame(reelAnimFrames[r]); const track = tracks[r]; const currentY = reelPositions[r];
      let html = ''; 
      for (let i = 0; i < 15; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
      final3.forEach(s => html += `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`);
      for (let i = 0; i < 5; i++) html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
      
      track.innerHTML = html; let startY = currentY % (15 * cellH); if(startY > 0) startY -= 15 * cellH;
      track.style.transition = 'none'; track.style.transform = `translate3d(0, ${startY}px, 0)`; track.getBoundingClientRect();
      
      let targetY = -15 * cellH; const dur = 800 + r * 200; 
      track.style.transition = `transform ${dur}ms cubic-bezier(0.1, 0.8, 0.2, 1)`; 
      track.style.transform = `translate3d(0, ${targetY}px, 0)`;
      
      setTimeout(() => {
        track.style.transition = 'none'; track.style.transform = 'translate3d(0,0,0)'; 
        track.innerHTML = final3.map(s => `<div class="cell" style="height:${cellH}px"><img src="${s}${IMG_VER}"></div>`).join('');
        resolve();
      }, dur + 50);
    }, r * 200);
  });
}

function genGrid(){
  const g=[];
  for(let r=0;r<REELS;r++){ const col=[]; for(let row=0;row<ROWS;row++) col.push(randSym()); g.push(col); }
  return g;
}

function calcWins(grid,perLine){
  const wins=[]; let total=0;
  PAYLINES.slice(0, state.lines).forEach((line,idx)=>{
    const syms=line.map(([r,row])=>grid[r][row]); 
    const firstSym = syms[0];
    if (firstSym === 'mushroom.png') return;
    let count = 1; let currentSym = firstSym;
    for(let i=1;i<REELS;i++){
      if (syms[i] === currentSym || syms[i] === 'gem.png') { count++; } else { break; }
    }
    if(count>=3){
      const mult=PAYTABLE[firstSym][count-3];
      if(mult>0){ total+=mult*perLine; wins.push({idx,line,count}); }
    }
  });
  return {total, wins};
}

function refreshUI(){
  $('balanceVal').textContent = fmt(state.balance); 
  $('betVal').textContent = fmt(state.betPerLine); 
  $('linesVal').textContent = state.lines;
  if(!isSpinning) $('winVal').textContent = '0';
}

async function startSpinAction() {
  if (isSpinning) return;
  const bet = totalBet();
  if (state.balance < bet) { notif('Недостаточно монет','error'); return; }
  
  state.balance -= bet; $('winVal').textContent = '0';
  isSpinning = true; stopRequested = false;
  refreshUI();
  
  const frameHeight = document.querySelector('.reels-frame').clientHeight;
  const cellH = frameHeight / 3;

  reelPositions = [0, 0, 0, 0, 0]; 
  tracks.forEach((tr, i) => startReelSpin(i, cellH));
  
  setTimeout(() => { if(isSpinning) requestStop(); }, 3000);
}

async function requestStop() {
  if (!isSpinning || stopRequested) return; 
  stopRequested = true;
  
  const bet = totalBet(); const perLine = state.betPerLine; 
  const finalGrid = genGrid();
  const frameHeight = document.querySelector('.reels-frame').clientHeight;
  const cellH = frameHeight / 3;

  await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i], cellH)));
  
  const {total, wins} = calcWins(finalGrid, perLine);
  
  if (total > 0) {
    state.balance += total; 
    $('winVal').textContent = fmt(total);
    notif('Выигрыш: +' + fmt(total) + ' 🪙', 'gold');
  } else {
    notif('Повезет в следующий раз!', 'error');
  }
  
  isSpinning = false; refreshUI();
}

// Привязка кнопок
$('spinBtn').onclick = () => { if (isSpinning) requestStop(); else startSpinAction(); };
$('linesDec').onclick = () => { if(!isSpinning){ state.lines = Math.max(1, state.lines-1); refreshUI(); } };
$('linesInc').onclick = () => { if(!isSpinning){ state.lines = Math.min(MAX_LINES, state.lines+1); refreshUI(); } };
$('betDec').onclick = () => { if(!isSpinning){ state.betPerLine = Math.max(1, state.betPerLine-1); refreshUI(); } };
$('betInc').onclick = () => { if(!isSpinning){ state.betPerLine += 1; refreshUI(); } };
$('autoBtn').onclick = () => notif('Автоспин включен');

// Инициализация
window.addEventListener('resize', () => { if(!isSpinning) buildReels(); });
buildReels(); refreshUI();
</script>
</body>
</html>
