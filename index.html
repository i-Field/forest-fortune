<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune 5x5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#f0f4f8;--gold:#ffd966;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;height:100dvh;}

/* Главный контейнер (вертикальный) */
.app {
    position: relative;
    width: 100vw;
    height: 100dvh;
    /* ВАЖНО: Если картинка называется bg.png, напиши bg.png вместо bg.png.PNG */
    background: url('bg.png.PNG?v=26') no-repeat center center;
    background-size: 100% 100%; 
    overflow: hidden;
}

/* ---------------- ДИНАМИЧЕСКИЙ ТЕКСТ ---------------- */
.ui-text {
    position: absolute; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-weight: 900; 
    text-shadow: 1px 1px 2px #000, 0 0 5px #000;
}

.ui-balance { top: 18.5%; left: 15%; width: 25%; height: 3%; font-size: 2vh; }
.ui-win { top: 18.5%; right: 15%; width: 25%; height: 3%; font-size: 2vh; }

.ui-lines { bottom: 31.5%; left: 12%; width: 18%; height: 3%; font-size: 1.8vh; }
.ui-bet { bottom: 31.5%; left: 41%; width: 18%; height: 3%; font-size: 1.8vh; }
.ui-total { bottom: 31.5%; right: 12%; width: 18%; height: 3%; font-size: 1.8vh; }

.ui-spin-text { bottom: 25.5%; left: 35%; width: 30%; height: 4%; font-size: 2.5vh; color: #a8ff78; text-shadow: 0 0 10px #2ecc71; }

/* ---------------- СЕТКА БАРАБАНОВ 5x5 ---------------- */
.reels-frame {
    position: absolute;
    top: 24%;    
    left: 11%;   
    right: 11%;  
    height: 42%; /* Фиксированная высота вместо bottom, чтобы ровно легло */
    background: #0d2112; 
    border-radius: 4px;
    overflow: hidden;
    z-index: 4;
    border: 2px solid #3a2311; 
    box-shadow: inset 0 0 30px #000;
}
.reels { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 1px; height: 100%; width: 100%; background: #000; }
.reel { background: transparent; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #0d2112; }
.track { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; }
.cell { display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; width: 100%; } 
.cell img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5)) drop-shadow(0 2px 2px rgba(0,0,0,0.8)); }
.cell.win::before { content: ""; position: absolute; inset: 2px; border: 2px solid #a8ff78; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,113,.6), transparent 70%); box-shadow: 0 0 15px #2ecc71; animation: winPulse .4s infinite alternate; }
@keyframes winPulse { 0%{transform:scale(.9)} 100%{transform:scale(1.1)} }

/* ---------------- НЕВИДИМЫЕ КНОПКИ ---------------- */
.btn-overlay { position: absolute; z-index: 10; cursor: pointer; border-radius: 10px; }
.btn-overlay:active { background: rgba(255,255,255,0.2); box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }

.btn-spin { bottom: 24%; left: 35%; width: 30%; height: 7%; border-radius: 20px; }
.btn-auto { bottom: 25.5%; right: 8%; width: 15%; height: 5%; }

.btn-lines-dec { bottom: 31.5%; left: 7%; width: 4%; height: 3%; }
.btn-lines-inc { bottom: 31.5%; left: 26%; width: 4%; height: 3%; }
.btn-bet-dec { bottom: 31.5%; left: 37%; width: 4%; height: 3%; }
.btn-bet-inc { bottom: 31.5%; left: 56%; width: 4%; height: 3%; }

.btn-action { bottom: 12%; width: 11%; height: 5%; }
.btn-wheel { left: 2%; }
.btn-shop { left: 14.5%; }
.btn-risk { left: 27%; }
.btn-friends { left: 39.5%; }
.btn-tasks { right: 39.5%; }
.btn-top { right: 27%; }
.btn-bonus { right: 14.5%; }
.btn-rules { right: 2%; }

.btn-l1 { bottom: 33.5%; left: 10%; width: 4%; height: 2.5%; }
.btn-l3 { bottom: 33.5%; left: 15%; width: 4%; height: 2.5%; }
.btn-l5 { bottom: 33.5%; left: 20%; width: 4%; height: 2.5%; }
.btn-l9 { bottom: 33.5%; left: 25%; width: 4%; height: 2.5%; }
.btn-l15 { bottom: 33.5%; left: 30%; width: 4%; height: 2.5%; }
.btn-l21 { bottom: 33.5%; left: 35%; width: 4%; height: 2.5%; }

.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:800;box-shadow:0 5px 15px rgba(0,0,0,.5);transition:top .3s;z-index:999;text-align:center}
.notif.show{top:15px}
.notif.error{background:#e74c3c}
.notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
</style>
</head>
<body>

<div class="app" id="gameArea">
    <div class="ui-text ui-balance" id="balanceVal">50 000</div>
    <div class="ui-text ui-win" id="winVal">0</div>
    <div class="ui-text ui-lines" id="linesVal">21</div>
    <div class="ui-text ui-bet" id="betVal">1</div>
    <div class="ui-text ui-total" id="totalBetVal">21</div>
    <div class="ui-text ui-spin-text">SPIN</div>

    <div class="reels-frame" id="reelsFrame">
        <div class="reels" id="reels"></div>
    </div>

    <div class="btn-overlay btn-spin" id="spinBtn"></div>
    <div class="btn-overlay btn-auto" id="autoBtn"></div>
    
    <div class="btn-overlay btn-lines-dec" id="linesDec"></div>
    <div class="btn-overlay btn-lines-inc" id="linesInc"></div>
    <div class="btn-overlay btn-bet-dec" id="betDec"></div>
    <div class="btn-overlay btn-bet-inc" id="betInc"></div>

    <div class="btn-overlay btn-l1" onclick="setLines(1)"></div>
    <div class="btn-overlay btn-l3" onclick="setLines(3)"></div>
    <div class="btn-overlay btn-l5" onclick="setLines(5)"></div>
    <div class="btn-overlay btn-l9" onclick="setLines(9)"></div>
    <div class="btn-overlay btn-l15" onclick="setLines(15)"></div>
    <div class="btn-overlay btn-l21" onclick="setLines(21)"></div>

    <div class="btn-overlay btn-action btn-wheel" onclick="notif('Колесо')"></div>
    <div class="btn-overlay btn-action btn-shop" onclick="notif('Магазин')"></div>
    <div class="btn-overlay btn-action btn-risk" onclick="notif('Риск')"></div>
    <div class="btn-overlay btn-action btn-friends" onclick="notif('Друзья')"></div>
    
    <div class="btn-overlay btn-action btn-tasks" onclick="notif('Задания')"></div>
    <div class="btn-overlay btn-action btn-top" onclick="notif('Рейтинг')"></div>
    <div class="btn-overlay btn-action btn-bonus" onclick="notif('Бонус получен!')"></div>
    <div class="btn-overlay btn-action btn-rules" onclick="notif('Правила')"></div>
</div>

<div class="notif" id="notif"></div>

<script>
const REELS = 5, ROWS = 5; 
const IMG_VER = '?v=26';
const SYMBOLS = ['gem.png', 'mushroom.png', 'hedgehog.png', 'acorn.png', 'leaf.png', 'coin.png'];
const WEIGHTS = {'gem.png':3, 'mushroom.png':8, 'hedgehog.png':15, 'acorn.png':25, 'leaf.png':25, 'coin.png':30};
const CLUSTER_MIN = 8; 

const PAYTABLE = {
    'gem.png': {8: 5, 12: 20, 15: 100, 20: 500},
    'mushroom.png': {8: 2, 12: 10, 15: 50},
    'hedgehog.png': {8: 1.5, 12: 5, 15: 20},
    'acorn.png': {8: 1, 12: 3, 15: 10},
    'leaf.png': {8: 1, 12: 3, 15: 10},
    'coin.png': {8: 0.5, 12: 2, 15: 5}
};

const POOL = []; Object.entries(WEIGHTS).forEach(([s,w])=>{ for(let i=0;i<w;i++) POOL.push(s); });

let state = { balance: 50000, betPerLine: 1, lines: 21 };
let isSpinning = false, currentGrid = [];
let cellH = 0;

const reelsEl = document.getElementById('reels');
const tracks = [];

function $(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
function notif(msg, type='') { const n=$('notif'); n.textContent=msg; n.className='notif show '+type; clearTimeout(n._t); n._t=setTimeout(()=>{n.className='notif '+type}, 2400); }
function randSym() { return POOL[Math.floor(Math.random()*POOL.length)]; }
function totalBet() { return state.lines * state.betPerLine; }

function setLines(num) {
    if(isSpinning) return;
    state.lines = num;
    updateUI();
}

function buildReels() {
    reelsEl.innerHTML = ''; tracks.length = 0;
    const frame = document.querySelector('.reels-frame');
    // Используем getBoundingClientRect().height, чтобы точно узнать высоту после загрузки
    const frameHeight = frame.getBoundingClientRect().height;
    cellH = frameHeight / ROWS;

    for (let r = 0; r < REELS; r++) {
        const reel = document.createElement('div'); 
        reel.className = 'reel';
        const track = document.createElement('div'); 
        track.className = 'track';
        
        let html = '';
        for (let row = 0; row < ROWS; row++) {
            // Задаем жесткую высоту каждой ячейке
            html += `<div class="cell" style="height:${cellH}px"><img src="${randSym()}${IMG_VER}"></div>`;
        }
        track.innerHTML = html;
        reel.appendChild(track); 
        reelsEl.appendChild(reel); 
        tracks.push(track);
    }
    updateUI();
}

function genGrid() {
    const g = [];
    for (let r = 0; r < REELS; r++) {
        const col = [];
        for (let row = 0; row < ROWS; row++) col.push(randSym());
        g.push(col);
    }
    return g;
}

function renderGrid(grid) {
    for (let r = 0; r < REELS; r++) {
        let html = '';
        for (let row = 0; row < ROWS; row++) {
            html += `<div class="cell" style="height:${cellH}px"><img src="${grid[r][row]}${IMG_VER}"></div>`;
        }
        tracks[r].innerHTML = html;
    }
}

function findClusters(grid) {
    const visited = Array(REELS).fill(null).map(() => Array(ROWS).fill(false));
    const clusters = [];

    function getNeighbors(r, c) {
        const n = [];
        if (r > 0) n.push([r-1, c]);
        if (r < REELS-1) n.push([r+1, c]);
        if (c > 0) n.push([r, c-1]);
        if (c < ROWS-1) n.push([r, c+1]);
        return n;
    }

    for (let r = 0; r < REELS; r++) {
        for (let c = 0; c < ROWS; c++) {
            if (visited[r][c]) continue;
            const sym = grid[r][c];
            if (sym === 'gem.png') continue; 
            
            const queue = [[r, c]];
            const cluster = [];
            visited[r][c] = true;

            while (queue.length > 0) {
                const [cr, cc] = queue.shift();
                cluster.push([cr, cc]);
                for (const [nr, nc] of getNeighbors(cr, cc)) {
                    if (!visited[nr][nc] && (grid[nr][nc] === sym || grid[nr][nc] === 'gem.png')) {
                        visited[nr][nc] = true;
                        queue.push([nr, nc]);
                    }
                }
            }
            if (cluster.length >= CLUSTER_MIN) {
                clusters.push({ sym, coords: cluster });
            }
        }
    }
    return clusters;
}

async function startSpin() {
    if (isSpinning) return;
    if (state.balance < totalBet()) { notif('Мало монет!', 'error'); return; }
    
    state.balance -= totalBet();
    isSpinning = true;
    $('winVal').textContent = '0';
    updateUI();

    let currentMultiplier = 1;
    let totalWin = 0;
    let cascadeCount = 0;

    currentGrid = genGrid();
    renderGrid(currentGrid);

    let hasClusters = true;
    while (hasClusters) {
        await new Promise(r => setTimeout(r, 600)); 
        const clusters = findClusters(currentGrid);
        
        if (clusters.length === 0) {
            hasClusters = false;
            break;
        }

        cascadeCount++;
        let cascadeWin = 0;

        document.querySelectorAll('.cell').forEach(c => c.classList.remove('win'));
        clusters.forEach(cl => {
            cl.coords.forEach(([r, c]) => {
                const cell = tracks[r].children[c];
                if (cell) cell.classList.add('win');
            });
            
            const count = cl.coords.length;
            const payTable = PAYTABLE[cl.sym];
            let mult = 0;
            if (count >= 20) mult = payTable[20] || 0;
            else if (count >= 15) mult = payTable[15] || 0;
            else if (count >= 12) mult = payTable[12] || 0;
            else if (count >= 8) mult = payTable[8] || 0;
            
            cascadeWin += mult * totalBet();
        });

        cascadeWin *= currentMultiplier;
        totalWin += cascadeWin;
        $('winVal').textContent = fmt(totalWin);
        
        if(cascadeCount > 1) notif(`Каскад ${cascadeCount}! x${currentMultiplier}`, 'gold');

        await new Promise(r => setTimeout(r, 800));

        const newGrid = JSON.parse(JSON.stringify(currentGrid));
        clusters.forEach(cl => {
            cl.coords.forEach(([r, c]) => { newGrid[r][c] = null; });
        });

        for (let r = 0; r < REELS; r++) {
            let emptySpots = 0;
            for (let c = ROWS - 1; c >= 0; c--) {
                if (newGrid[r][c] === null) emptySpots++;
                else if (emptySpots > 0) {
                    newGrid[r][c + emptySpots] = newGrid[r][c];
                    newGrid[r][c] = null;
                }
            }
            for (let c = 0; c < emptySpots; c++) {
                newGrid[r][c] = randSym();
            }
        }

        currentGrid = newGrid;
        renderGrid(currentGrid);
        currentMultiplier *= 2; 
    }

    if (totalWin > 0) {
        state.balance += totalWin;
        notif(`Выигрыш: +${fmt(totalWin)} 🪙`, 'gold');
    } else {
        notif('Повезет в следующий раз!', 'error');
    }

    isSpinning = false;
    updateUI();
}

function updateUI() {
    $('balanceVal').textContent = fmt(state.balance);
    $('linesVal').textContent = state.lines;
    $('betVal').textContent = fmt(state.betPerLine);
    $('totalBetVal').textContent = fmt(totalBet());
}

$('spinBtn').onclick = startSpin;
$('autoBtn').onclick = () => notif('Автоспин в разработке');
$('linesDec').onclick = () => { if(!isSpinning && state.lines > 1) { state.lines--; updateUI(); } };
$('linesInc').onclick = () => { if(!isSpinning && state.lines < 21) { state.lines++; updateUI(); } };
$('betDec').onclick = () => { if(!isSpinning && state.betPerLine > 1) { state.betPerLine--; updateUI(); } };
$('betInc').onclick = () => { if(!isSpinning) { state.betPerLine++; updateUI(); } };

// Запускаем расчет сетки только после того, как страница полностью загрузится
window.addEventListener('load', () => {
    setTimeout(buildReels, 100);
});
window.addEventListener('resize', () => { if (!isSpinning) buildReels(); });
</script>
</body>
</html>
