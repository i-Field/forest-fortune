<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune 5x5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --text: #f0f4f8;
    --gold: #ffd966;
    --mask: #140702; /* Темное дерево для плашек */
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ============================================================
   АРХИТЕКТУРА (КАРТИНКА КАК ФОН)
   ============================================================ */
.game-board {
    position: relative;
    aspect-ratio: 768 / 1370; 
    width: 100vw;
    max-height: 100dvh; 
    background: url('bg.png?v=60000') no-repeat center center;
    background-size: 100% 100%; 
    overflow: hidden;
}

/* ============================================================
   ДИНАМИЧЕСКИЕ ЦИФРЫ (СДВИНУТЫ ПО ТВОИМ КООРДИНАТАМ)
   ============================================================ */
.ui-val {
    position: absolute;
    display: flex; 
    align-items: center; 
    justify-content: center;
    background: var(--mask); 
    color: var(--gold);
    font-weight: 900;
    font-size: 3vw;
    text-shadow: 1px 1px 2px #000;
    border-radius: 4px;
    z-index: 60;
}

/* Верхние цифры (Баланс вверх на 2мм, вправо на 8мм. Выигрыш вверх на 2мм, вправо на 12мм) */
.ui-balance { top: 18.0%; left: 24.5%; width: 11.5%; height: 3.2%; }
.ui-win { top: 18.0%; right: 23.5%; width: 7.5%; height: 3.2%; }

/* Нижние цифры (Опущены вниз в свои окошки) */
.ui-lines { top: 66.3%; left: 19.5%; width: 8%; height: 3.2%; }
.ui-bet { top: 66.3%; left: 45.5%; width: 8%; height: 3.2%; }
.ui-total { top: 66.3%; right: 17.8%; width: 8%; height: 3.2%; }

/* ============================================================
   СЕТКА 5x5 (ОПУЩЕНА НА 5 ММ)
   ============================================================ */
.reels-frame {
    position: absolute;
    top: 25.8%; left: 13.6%; right: 13.6%; /* Опустили на 5мм */
    height: 38.5%; /* Чуть уменьшили, чтобы 6-й ряд не вылезал */
    background: #0d2112;
    border-radius: 4px;
    overflow: hidden; 
    z-index: 10;
    border-bottom: 10px solid #0d2112; /* Жесткая заглушка снизу */
}

.reels { 
    display: grid; 
    grid-template-columns: repeat(5, 1fr); 
    height: 100%; 
    width: 100%; 
    background: #000; 
    gap: 1px; 
}
.reel { 
    background: #0d2112; 
    overflow: hidden; 
    position: relative; 
    height: 100%; 
}
.track { 
    position: absolute; 
    left: 0; 
    right: 0; 
    top: 0; 
    display: flex; 
    flex-direction: column; 
    will-change: transform; 
}
.cell { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    flex-shrink: 0; 
    width: 100%; 
    height: 20%; 
} 
.cell img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5)) drop-shadow(0 2px 2px rgba(0,0,0,0.8)); }

/* Слой для линий */
.lines-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

/* ============================================================
   НЕВИДИМЫЕ КНОПКИ (РАБОТАЮТ)
   ============================================================ */
.btn-overlay { 
    position: absolute; 
    z-index: 99999; 
    cursor: pointer; 
    border-radius: 8px; 
    pointer-events: auto;
}
.btn-overlay:active { background: rgba(255,255,255,0.2); }

/* Глобус и Звук */
.btn-lang { top: 1.5%; left: 2.5%; width: 9%; height: 4.5%; border-radius: 50%; }
.btn-sound { top: 1.5%; right: 2.5%; width: 9%; height: 4.5%; border-radius: 50%; }

/* Кнопка Spin (Текст убран, только зона клика) */
.btn-spin { top: 69.8%; left: 34%; width: 32%; height: 6.5%; border-radius: 20px; }

/* Кнопка Auto */
.btn-auto { top: 70.2%; right: 10.5%; width: 14%; height: 5.5%; }

/* Стрелки линий и ставки */
.btn-lines-dec { top: 66.3%; left: 15%; width: 4%; height: 3.3%; }
.btn-lines-inc { top: 66.3%; left: 29%; width: 4%; height: 3.3%; }
.btn-bet-dec { top: 66.3%; left: 41.5%; width: 4%; height: 3.3%; }
.btn-bet-inc { top: 66.3%; left: 56%; width: 4%; height: 3.3%; }

/* Кнопки 1, 3, 5, 9, 15, 21 */
.btn-l1 { top: 69.8%; left: 10.5%; width: 4.5%; height: 3.5%; }
.btn-l3 { top: 69.8%; left: 16%; width: 4.5%; height: 3.5%; }
.btn-l5 { top: 69.8%; left: 21.5%; width: 4.5%; height: 3.5%; }
.btn-l9 { top: 69.8%; left: 27%; width: 4.5%; height: 3.5%; }
.btn-l15 { top: 69.8%; left: 32.5%; width: 4.5%; height: 3.5%; }
.btn-l21 { top: 69.8%; left: 38%; width: 4.5%; height: 3.5%; }

/* НИЖНИЕ КНОПКИ */
.btn-action { top: 79.8%; width: 11%; height: 5.5%; z-index: 99999; }
.btn-wheel { left: 2.5%; }
.btn-shop { left: 14.5%; }
.btn-risk { left: 26.5%; }
.btn-friends { left: 39%; }
.btn-tasks { right: 39%; }
.btn-top { right: 26.5%; }
.btn-bonus { right: 14.5%; }
.btn-rules { right: 2.5%; }

/* Подсветка Риска */
@keyframes riskPulse { 0% { box-shadow: 0 0 10px #f1c40f; background: rgba(241, 196, 15, 0.2); } 100% { box-shadow: 0 0 20px #f1c40f; background: rgba(241, 196, 15, 0.6); } }
.btn-risk.active-risk { animation: riskPulse 0.8s infinite alternate; border-radius: 12px; background: rgba(241, 196, 15, 0.4); }

/* ============================================================
   МОДАЛКИ И УВЕДОМЛЕНИЯ
   ============================================================ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100000;opacity:0;pointer-events:none;transition:opacity .2s;padding:15px}
.modal.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,#1a2e1a,#0a1208);border:2px solid var(--gold);border-radius:14px;padding:20px;max-width:340px;width:100%;text-align:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.modal-title{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:15px;font-family:Georgia,serif;}
.modal-text{font-size:14px;color:#ccc;margin-bottom:15px;line-height:1.4;}
.modal-close{background:#576574;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:800;margin-top:15px;width:100%;font-size:14px;}
.modal-btns{display:flex;flex-direction:column;gap:8px;}
.modal-btn{padding:14px;border-radius:8px;border:none;font-size:16px;font-weight:900;cursor:pointer;color:#fff;}
.modal-btn.green{background:linear-gradient(180deg,#2ecc71,#1a7d43); box-shadow:0 4px 0 #0f3d22;}
.modal-btn.red{background:linear-gradient(180deg,#e74c3c,#922b21); box-shadow:0 4px 0 #4d0e07;}
.modal-btn:active{transform:translateY(3px); box-shadow:none;}

.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:800;transition:top .3s;z-index:999999;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.5);}
.notif.show{top:15px} .notif.error{background:#e74c3c} .notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
</style>
</head>
<body>

<div class="game-board" id="gameBoard">
    
    <!-- Динамические цифры -->
    <div class="ui-val ui-balance" id="balanceVal">1 120</div>
    <div class="ui-val ui-win" id="winVal">0</div>
    <div class="ui-val ui-lines" id="linesVal">15/21</div>
    <div class="ui-val ui-bet" id="betVal">1</div>
    <div class="ui-val ui-total" id="totalBetVal">15</div>

    <!-- Сетка -->
    <div class="reels-frame" id="reelsFrame">
        <div class="reels" id="reels"></div>
        <svg class="lines-overlay" id="linesOverlay"></svg>
    </div>

    <!-- Невидимые кнопки -->
    <div class="btn-overlay btn-lang" onclick="cycleLang()"></div>
    <div class="btn-overlay btn-sound" onclick="toggleSound()"></div>

    <div class="btn-overlay btn-spin" id="spinBtn"></div>
    <div class="btn-overlay btn-auto" onclick="toggleAuto()"></div>
    
    <div class="btn-overlay btn-lines-dec" id="linesDec"></div>
    <div class="btn-overlay btn-lines-inc" id="linesInc"></div>
    <div class="btn-overlay btn-bet-dec" id="betDec"></div>
    <div class="btn-overlay btn-bet-inc" id="betInc"></div>

    <div class="btn-overlay btn-l1" onclick="setLines(1)"></div>
    <div class="btn-overlay btn-l3" onclick="setLines(3)"></div>
    <div class="btn-overlay btn-l5" onclick="setLines(5)"></div>
    <div class="btn-overlay btn-l9" onclick="setLines(9)"></div>
    <div class="btn-overlay btn-l15" onclick="setLines(15)"></div>
    <div class="btn-overlay btn-l21" onclick="setLines(21)"></div>

    <!-- Нижние кнопки -->
    <div class="btn-overlay btn-action btn-wheel" onclick="openModal('wheelModal')"></div>
    <div class="btn-overlay btn-action btn-shop" onclick="openModal('shopModal')"></div>
    <div class="btn-overlay btn-action btn-risk" id="btnRiskUI" onclick="openRiskModal()"></div>
    <div class="btn-overlay btn-action btn-friends" onclick="openModal('friendsModal')"></div>
    <div class="btn-overlay btn-action btn-tasks" onclick="openModal('tasksModal')"></div>
    <div class="btn-overlay btn-action btn-top" onclick="openModal('topModal')"></div>
    <div class="btn-overlay btn-action btn-bonus" onclick="claimDaily()"></div>
    <div class="btn-overlay btn-action btn-rules" onclick="openModal('paytableModal')"></div>
</div>

<!-- МОДАЛКИ -->
<div class="modal" id="wheelModal"><div class="modal-box"><div class="modal-title">🎡 КОЛЕСО</div><div class="modal-text">Крути раз в 24 часа!</div><button class="modal-close" onclick="closeModal('wheelModal')">Закрыть</button></div></div>
<div class="modal" id="shopModal"><div class="modal-box"><div class="modal-title">⭐ МАГАЗИН</div><div class="modal-text">Покупка звезд (в разработке)</div><button class="modal-close" onclick="closeModal('shopModal')">Закрыть</button></div></div>
<div class="modal" id="riskModal"><div class="modal-box" style="border-color:#f1c40f;"><div class="modal-title">🃏 РИСК-ИГРА</div><div class="modal-text" id="riskText">Рискнуть?</div><div class="modal-btns"><button class="modal-btn green" onclick="playRisk(true)">ВЫШЕ (x2)</button><button class="modal-btn red" onclick="playRisk(false)">НИЖЕ (x2)</button></div><button class="modal-close" onclick="takeRiskMoney()">ЗАБРАТЬ ВСЁ</button></div></div>
<div class="modal" id="friendsModal"><div class="modal-box"><div class="modal-title">🤝 ДРУЗЬЯ</div><div class="modal-text">Приглашайте и получайте 5000 монет!</div><button class="modal-close" onclick="closeModal('friendsModal')">Закрыть</button></div></div>
<div class="modal" id="tasksModal"><div class="modal-box"><div class="modal-title">📜 ЗАДАНИЯ</div><div class="modal-text">Скоро тут будут задания</div><button class="modal-close" onclick="closeModal('tasksModal')">Закрыть</button></div></div>
<div class="modal" id="topModal"><div class="modal-box"><div class="modal-title">🏆 ТОП</div><div class="modal-text">Загрузка...</div><button class="modal-close" onclick="closeModal('topModal')">Закрыть</button></div></div>
<div class="modal" id="paytableModal"><div class="modal-box"><div class="modal-title">📋 ПРАВИЛА</div><div class="modal-text">Собери 3+ одинаковых символа слева направо. Грибы дают фриспины.</div><button class="modal-close" onclick="closeModal('paytableModal')">Закрыть</button></div></div>

<div class="notif" id="notif"></div>

<script>
const REELS = 5, ROWS = 5; 
const IMG_VER = '?v=60000';
const SYMBOLS = ['gem.png', 'mushroom.png', 'hedgehog.png', 'acorn.png', 'leaf.png', 'coin.png'];
const WEIGHTS = {'gem.png':5, 'mushroom.png':10, 'hedgehog.png':15, 'acorn.png':25, 'leaf.png':25, 'coin.png':30};
const PAYTABLE = { 'gem.png': [15, 60, 250], 'mushroom.png': [10, 40, 150], 'hedgehog.png': [8, 25, 80], 'acorn.png': [5, 15, 50], 'leaf.png': [5, 15, 50], 'coin.png': [2, 5, 15] };

const PAYLINES = [
    [[0,0],[1,0],[2,0],[3,0],[4,0]], [[0,1],[1,1],[2,1],[3,1],[4,1]], [[0,2],[1,2],[2,2],[3,2],[4,2]], [[0,3],[1,3],[2,3],[3,3],[4,3]], [[0,4],[1,4],[2,4],[3,4],[4,4]],
    [[0,0],[1,1],[2,2],[3,1],[4,0]], [[0,4],[1,3],[2,2],[3,3],[4,4]], [[0,1],[1,2],[2,3],[3,2],[4,1]], [[0,3],[1,2],[2,1],[3,2],[4,3]],
    [[0,0],[1,0],[2,1],[3,2],[4,2]], [[0,4],[1,4],[2,3],[3,2],[4,2]], [[0,2],[1,1],[2,0],[3,1],[4,2]], [[0,2],[1,3],[2,4],[3,3],[4,2]],
    [[0,1],[1,0],[2,0],[3,0],[4,1]], [[0,3],[1,4],[2,4],[3,4],[4,3]], [[0,0],[1,1],[2,1],[3,1],[4,0]], [[0,4],[1,3],[2,3],[3,3],[4,4]],
    [[0,1],[1,1],[2,2],[3,3],[4,3]], [[0,3],[1,3],[2,2],[3,1],[4,1]], [[0,0],[1,2],[2,4],[3,2],[4,0]], [[0,4],[1,2],[2,0],[3,2],[4,4]]
];
const LINE_COLORS = ['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0ff','#5856d6','#af52de','#ff2d95','#ff6b6b','#ffd93d','#6bcf7f','#4ecdc4','#95e1d3','#a8e6cf','#c7ceea','#e2a4d1','#f6d365','#b5eaea','#e0aaff','#ffb4a2'];

const POOL=[];Object.entries(WEIGHTS).forEach(([s,w])=>{for(let i=0;i<w;i++)POOL.push(s)});

// Убрал загрузку из localStorage, чтобы игра не крутилась сама
let state = { balance: 1120, betPerLine: 1, lines: 15, lastDaily: 0, sound: true, lang: 'ru' };
let isSpinning = false, stopRequested = false;
let freeSpins = 0, isFreeSpin = false;
let pendingRisk = 0;
let spinTimeout = null; 

const reelsEl = document.getElementById('reels');
const overlay = document.getElementById('linesOverlay');
const tracks = [];

const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('ru-RU');
function notif(msg, type='') { const n=$('notif'); n.textContent=msg; n.className='notif show '+type; clearTimeout(n._t); n._t=setTimeout(()=>{n.className='notif '+type}, 3000); }
const randSym = () => POOL[Math.floor(Math.random()*POOL.length)];
const totalBet = () => state.lines * state.betPerLine;
const openModal = (id) => { $(id).classList.add('active'); };
const closeModal = (id) => $(id).classList.remove('active');

function cycleLang() {
    const langs = ['ru', 'uk', 'en'];
    let idx = langs.indexOf(state.lang);
    idx = (idx + 1) % langs.length;
    state.lang = langs[idx];
    notif('Language: ' + state.lang.toUpperCase());
}

function toggleSound() {
    state.sound = !state.sound;
    notif(state.sound ? '🔊 Звук ВКЛ' : '🔇 Звук ВЫКЛ');
}

function showActiveLines() {
    overlay.innerHTML = '';
    const fRect = $('reelsFrame').getBoundingClientRect();
    overlay.setAttribute('width', fRect.width);
    overlay.setAttribute('height', fRect.height);

    PAYLINES.slice(0, state.lines).forEach((line, idx) => {
        const pts = [];
        for (const [r, row] of line) {
            const cell = tracks[r].children[row];
            if (!cell) continue;
            const cr = cell.getBoundingClientRect();
            pts.push([cr.left + cr.width/2 - fRect.left, cr.top + cr.height/2 - fRect.top]);
        }
        if (pts.length < 2) return;
        const color = LINE_COLORS[idx % LINE_COLORS.length];
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
        poly.setAttribute('stroke', color);
        poly.setAttribute('stroke-width', '5');
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke-linecap', 'round');
        poly.setAttribute('stroke-linejoin', 'round');
        overlay.appendChild(poly);
    });

    setTimeout(() => { overlay.innerHTML = ''; }, 2000);
}

function setLines(num) {
    if(isSpinning) return; 
    state.lines = num; 
    updateUI(); 
    notif('Линий: ' + num);
    showActiveLines();
}

function updateUI() {
    $('balanceVal').textContent = fmt(state.balance); 
    $('betVal').textContent = fmt(state.betPerLine); 
    $('linesVal').textContent = state.lines + '/21';
    $('totalBetVal').textContent = fmt(totalBet());
    if(!isSpinning) $('winVal').textContent = '0';
}

function buildReels() {
    reelsEl.innerHTML = ''; tracks.length = 0;
    
    for (let r = 0; r < REELS; r++) {
        const reel = document.createElement('div'); reel.className = 'reel';
        const track = document.createElement('div'); track.className = 'track';
        track.style.height = '100%'; 
        let html = '';
        for (let row = 0; row < ROWS; row++) html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
        track.innerHTML = html; reel.appendChild(track); reelsEl.appendChild(reel); tracks.push(track);
    }
    updateUI();
}

let reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

function startReelSpin(r) {
    const track = tracks[r]; let html = ''; 
    for (let i = 0; i < 40; i++) html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
    track.innerHTML = html; 
    let lastTime = performance.now(); 
    const speed = 2000;
    const frameHeight = track.clientHeight / 5; 
    
    function frame(now) {
        if (!isSpinning) return; 
        const dt = (now - lastTime) / 1000; lastTime = now;
        reelPositions[r] -= speed * dt; 
        if (reelPositions[r] <= -(20 * frameHeight)) reelPositions[r] += 20 * frameHeight;
        track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
        reelAnimFrames[r] = requestAnimationFrame(frame);
    }
    reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final5) {
    return new Promise(resolve => {
        setTimeout(() => {
            cancelAnimationFrame(reelAnimFrames[r]); 
            const track = tracks[r]; const currentY = reelPositions[r];
            const frameHeight = track.clientHeight / 5; 
            
            let html = ''; 
            for (let i = 0; i < 15; i++) html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
            final5.forEach(s => html += `<div class="cell"><img src="${s}${IMG_VER}"></div>`);
            for (let i = 0; i < 5; i++) html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
            
            track.innerHTML = html; 
            let startY = currentY % (15 * frameHeight); 
            if(startY > 0) startY -= 15 * frameHeight;
            
            track.style.transition = 'none'; 
            track.style.transform = `translate3d(0, ${startY}px, 0)`; 
            track.getBoundingClientRect(); 
            
            track.style.transition = `transform ${800 + r*200}ms cubic-bezier(0.1, 0.8, 0.2, 1)`; 
            track.style.transform = `translate3d(0, -${15 * frameHeight}px, 0)`;
            
            setTimeout(() => { 
                track.style.transition = 'none'; 
                track.style.transform = 'translate3d(0,0,0)'; 
                track.innerHTML = final5.map(s => `<div class="cell"><img src="${s}${IMG_VER}"></div>`).join(''); 
                resolve(); 
            }, 800 + r*200 + 50);
        }, r * 200);
    });
}

async function startSpin() {
    if (isSpinning) return;
    if (state.balance < totalBet()) { notif('Мало монет!', 'error'); return; }
    
    state.balance -= totalBet(); 
    isSpinning = true; 
    stopRequested = false; 
    $('winVal').textContent = '0';
    updateUI(); 
    $('btnRiskUI').classList.remove('active-risk');
    overlay.innerHTML = '';
    
    const finalGrid = []; 
    for (let r=0; r<REELS; r++) { const col=[]; for(let c=0; c<ROWS; c++) col.push(randSym()); finalGrid.push(col); }
    
    reelPositions = [0, 0, 0, 0, 0]; 
    tracks.forEach((tr, i) => startReelSpin(i));
    
    spinTimeout = setTimeout(() => { if(!stopRequested && isSpinning) requestStop(finalGrid); }, 5000);
}

async function requestStop(pregeneratedGrid) {
    if (!isSpinning || stopRequested) return; 
    stopRequested = true;
    if(spinTimeout) clearTimeout(spinTimeout);
    
    const finalGrid = pregeneratedGrid || genGrid(); 
    await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i])));
    
    let total = 0, scatterCount = 0;
    for(let r=0; r<REELS; r++) for(let c=0; c<ROWS; c++) if(finalGrid[r][c] === 'mushroom.png') scatterCount++;

    PAYLINES.slice(0, state.lines).forEach(line => {
        const syms = line.map(([r,row])=>finalGrid[r][row]); 
        const firstSym = syms[0];
        if(firstSym === 'mushroom.png') return;
        let count = 1;
        for(let i=1; i<REELS; i++) { if(syms[i] === firstSym || syms[i] === 'gem.png') count++; else break; }
        if(count >= 3) total += PAYTABLE[firstSym][count-3] * state.betPerLine;
    });

    if (total > 0) {
        if (isFreeSpin) total *= 2;
        state.balance += total; 
        $('winVal').textContent = fmt(total); 
        notif('Выигрыш: +' + fmt(total), 'gold');
        
        if (total >= totalBet() * 2 && !isFreeSpin) {
            pendingRisk = total;
            $('btnRiskUI').classList.add('active-risk');
        }
    } else { 
        notif('Повезет в следующий раз!', 'error'); 
    }

    if (scatterCount >= 3 && !isFreeSpin) { 
        freeSpins = 10; 
        notif('🎉 3 ГРИБА! 10 ФРИСПИНОВ x2!', 'gold'); 
    }
    
    isSpinning = false; 
    updateUI();

    if (freeSpins > 0) { 
        freeSpins--; 
        isFreeSpin = true; 
        spinTimeout = setTimeout(startSpin, 1000); 
    } else { 
        isFreeSpin = false; 
    }
}

function toggleAuto() {
    if(isSpinning) return;
    notif('Автоспин запущен');
    startSpin();
}

function genGrid() {
    const g = [];
    for (let r = 0; r < REELS; r++) { const col = []; for (let row = 0; row < ROWS; row++) col.push(randSym()); g.push(col); }
    return g;
}

function openRiskModal() {
    if (pendingRisk <= 0) { notif('Нет выигрыша для риска!', 'error'); return; }
    $('riskText').textContent = `Вы рискуете суммой ${fmt(pendingRisk)} 🪙. Угадайте карту (шанс 50/50), чтобы удвоить!`;
    openModal('riskModal');
}

function playRisk(isHigher) {
    if (pendingRisk <= 0) return;
    closeModal('riskModal');
    const card1 = Math.floor(Math.random() * 13) + 1;
    const card2 = Math.floor(Math.random() * 13) + 1;
    let won = false;
    if (isHigher) won = card2 > card1; else won = card2 < card1;
    if (card1 === card2) won = false;

    if (won) {
        state.balance += pendingRisk; notif(`🎉 Победа! +${fmt(pendingRisk)}`, 'gold');
    } else {
        state.balance -= pendingRisk; notif(`❌ Проигрыш: -${fmt(pendingRisk)}`, 'error');
    }
    pendingRisk = 0;
    $('btnRiskUI').classList.remove('active-risk');
    updateUI();
}

function takeRiskMoney() {
    closeModal('riskModal');
    pendingRisk = 0;
    $('btnRiskUI').classList.remove('active-risk');
    notif('Вы забрали выигрыш!', 'success');
}

function claimDaily() {
    if (Date.now() - state.lastDaily < 24*3600*1000) { notif('Бонус уже получен! Ждите 24ч', 'error'); return; }
    state.lastDaily = Date.now(); state.balance += 1000; updateUI(); notif('🎁 Ежедневный бонус: +1000 🪙', 'gold');
}

$('spinBtn').onclick = (e) => { 
    e.preventDefault(); e.stopPropagation();
    if (isSpinning) requestStop(); else startSpin(); 
};

$('linesDec').onclick = () => { if(!isSpinning){ setLines(Math.max(1, state.lines-1)); } };
$('linesInc').onclick = () => { if(!isSpinning){ setLines(Math.min(21, state.lines+1)); } };
$('betDec').onclick = () => { if(!isSpinning){ state.betPerLine = Math.max(1, state.betPerLine-1); updateUI(); } };
$('betInc').onclick = () => { if(!isSpinning){ state.betPerLine += 1; updateUI(); } };

document.querySelector('.btn-wheel').onclick = () => openModal('wheelModal');
document.querySelector('.btn-shop').onclick = () => openModal('shopModal');
document.querySelector('.btn-friends').onclick = () => openModal('friendsModal');
document.querySelector('.btn-tasks').onclick = () => openModal('tasksModal');
document.querySelector('.btn-top').onclick = () => openModal('topModal');
document.querySelector('.btn-rules').onclick = () => openModal('paytableModal');
document.querySelector('.btn-bonus').onclick = () => claimDaily();

window.addEventListener('resize', () => { if(!isSpinning) buildReels(); });
buildReels();
</script>
</body>
</html>
