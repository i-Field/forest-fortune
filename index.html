<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Fortune 5x5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СБРОС СТИЛЕЙ
   ============================================================ */
:root {
    --text: #f0f4f8;
    --gold: #ffd966; 
    --wood: rgba(15, 7, 2, 0.9); 
    --holo: #00ffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}

/* ============================================================
   2. СТАРТОВЫЙ ЭКРАН
   ============================================================ */
#startScreen {
    position: fixed; inset: 0; background: radial-gradient(circle, #112211, #000);
    z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s;
}
#startScreen.hidden { opacity: 0; pointer-events: none; }
.start-title { 
    font-size: 34px; color: #a8ff78; font-family: Georgia, serif; font-weight: 900; 
    text-shadow: 0 0 20px #2ecc71; margin-bottom: 25px; text-align: center;
}
.start-btn { 
    background: linear-gradient(180deg, #2ecc71, #1a7d43); border: 2px solid #a8ff78;
    color: #fff; padding: 18px 45px; border-radius: 12px; font-size: 22px; font-weight: 900;
    box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6); cursor: pointer;
    font-family: Georgia, serif; transition: transform 0.1s;
}
.start-btn:active { transform: scale(0.95); }

/* ============================================================
   3. АРХИТЕКТУРА ИГРОВОГО ПОЛЯ
   ============================================================ */
.game-board {
    position: relative;
    aspect-ratio: 768 / 1370; /* Пропорции оригинальной картинки */
    width: 100vw;
    max-height: 100dvh; 
    background: url('bg.png?v=55555555') no-repeat center center;
    background-size: 100% 100%; 
    overflow: hidden;
}

/* ============================================================
   4. ДЕКОРАЦИИ (ОГОНЬ, СВЕТЛЯЧКИ)
   ============================================================ */
.fire-glow {
    position: absolute; top: 12.5%; width: 12%; height: 4%;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.8) 0%, transparent 70%);
    mix-blend-mode: screen; pointer-events: none; z-index: 5;
    animation: fireFlicker 1.5s infinite alternate;
}
.fire-left { left: 12%; }
.fire-right { right: 12%; }
@keyframes fireFlicker {
    0% { opacity: 0.4; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1.1); }
}

.firefly {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: #a8ff78; box-shadow: 0 0 12px 3px #2ecc71, 0 0 4px #fff;
    pointer-events: none; z-index: 6; opacity: 0;
    animation: floatFly 4s infinite ease-in-out;
}
.f1 { bottom: 18%; left: 8%; animation-delay: 0s; }
.f2 { bottom: 25%; left: 12%; animation-delay: 1s; }
.f3 { bottom: 20%; right: 10%; animation-delay: 0.5s; }
.f4 { bottom: 30%; right: 15%; animation-delay: 1.5s; }
.f5 { bottom: 35%; left: 5%; animation-delay: 2s; }
.f6 { bottom: 15%; right: 6%; animation-delay: 0.8s; }
@keyframes floatFly {
    0%, 100% { transform: translateY(0) scale(0.5); opacity: 0; }
    50% { transform: translateY(-40px) scale(1.5); opacity: 1; }
}

/* ============================================================
   5. UI ЭЛЕМЕНТЫ (ЦИФРЫ И СЧЕТЧИКИ)
   ============================================================ */
.ui-val {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, var(--wood) 30%, transparent 100%); 
    color: var(--gold);
    font-family: Georgia, serif; font-weight: 900; font-size: 3.5vw; 
    line-height: 1; text-shadow: 1px 1px 3px #000;
    z-index: 60; height: 3.2%; overflow: visible; 
}

/* Выравнивание по скриншоту */
.ui-balance { top: 18.05%; left: 31.8%; width: 10.5%; }
.ui-win { top: 18.05%; right: 15.5%; width: 7%; }
.ui-lines { top: 68.95%; left: 20.8%; width: 9%; }
.ui-bet { top: 68.95%; left: 45.5%; width: 8%; }

/* "Всего" - поднято ровно на 0.1 мм (визуально чуть выше) */
.ui-total { top: 68.8%; right: 20.6%; width: 8.5%; } 

/* ============================================================
   6. ИГРОВАЯ СЕТКА 5x5
   ============================================================ */
.reels-frame {
    position: absolute; top: 26.7%; left: 14.5%; right: 14.5%; height: 40.8%; 
    background: #0d2112; border-radius: 4px; overflow: hidden; z-index: 10;
}

.reels { 
    display: grid; grid-template-columns: repeat(5, 1fr); height: 100%; width: 100%; 
    background: #000; gap: 1px; 
}
.reel { background: #0d2112; overflow: hidden; position: relative; height: 100%; }
.track { 
    position: absolute; left: 0; right: 0; top: 0; 
    display: flex; flex-direction: column; will-change: transform; 
}
.cell { 
    display: flex; align-items: center; justify-content: center; 
    position: relative; flex-shrink: 0; width: 100%; height: 20%; 
} 
.cell img { 
    width: 90%; height: 90%; object-fit: contain; 
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5)) drop-shadow(0 2px 2px rgba(0,0,0,0.8)); 
}

/* Анимация выигрышной ячейки */
.cell.win::before { 
    content: ""; position: absolute; inset: 2px; 
    border: 3px solid #ffd966; border-radius: 8px; 
    background: rgba(255, 217, 102, 0.3); 
    box-shadow: 0 0 20px #ffd966, inset 0 0 15px #ffd966; 
    animation: winPulse .4s infinite alternate; z-index: 30;
}
@keyframes winPulse { 
    0% { transform: scale(0.95); opacity: 0.8; } 
    100% { transform: scale(1.05); opacity: 1; } 
}

.lines-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

/* ============================================================
   7. КНОПКИ И ЗОНЫ КЛИКА
   ============================================================ */
.btn-overlay { 
    position: absolute; z-index: 999999; cursor: pointer; border-radius: 8px; 
    pointer-events: auto; transition: all 0.2s;
}

.btn-overlay:active, .btn-overlay.glow { 
    background: rgba(0, 255, 255, 0.15); 
    box-shadow: 0 0 15px var(--holo), inset 0 0 10px var(--holo);
    border: 2px solid var(--holo); 
}

/* Верхние кнопки */
.btn-lang { top: 1.5%; left: 2.5%; width: 9%; height: 4.5%; border-radius: 50%; }
.btn-sound { top: 1.5%; right: 2.5%; width: 9%; height: 4.5%; border-radius: 50%; }

/* Кнопка "Крутить" - опущена вниз для точного совпадения с картинкой */
.btn-spin { top: 71.5%; left: 33%; width: 34%; height: 7.5%; border-radius: 20px; }

/* Кнопка Авто */
.btn-auto { top: 71.8%; right: 10.5%; width: 14%; height: 5.5%; }

/* Кнопки + и - */
.btn-lines-dec { top: 68.95%; left: 17.5%; width: 4%; height: 3.3%; }
.btn-lines-inc { top: 68.95%; left: 32.5%; width: 4%; height: 3.3%; }
.btn-bet-dec { top: 68.95%; left: 43%; width: 4%; height: 3.3%; }
.btn-bet-inc { top: 68.95%; left: 57.5%; width: 4%; height: 3.3%; }

/* Быстрые ставки линий */
.btn-l1 { top: 69.2%; left: 9.5%; width: 6%; height: 4%; }
.btn-l3 { top: 69.2%; left: 15.5%; width: 6%; height: 4%; }
.btn-l5 { top: 69.2%; left: 21.5%; width: 6%; height: 4%; }
.btn-l9 { top: 69.2%; left: 27.5%; width: 6%; height: 4%; }
.btn-l15 { top: 69.2%; left: 33.5%; width: 6%; height: 4%; }
.btn-l21 { top: 69.2%; left: 39.5%; width: 6%; height: 4%; }

/* Нижнее меню */
.btn-action { top: 80%; width: 11%; height: 5.5%; z-index: 999999; }
.btn-wheel { left: 2.5%; }
.btn-shop { left: 14.5%; }
.btn-risk { left: 26.5%; }
.btn-friends { left: 39%; }
.btn-tasks { right: 39%; }
.btn-top { right: 26.5%; }
.btn-bonus { right: 14.5%; }
.btn-rules { right: 2.5%; }

/* ============================================================
   8. МОДАЛЬНЫЕ ОКНА И УВЕДОМЛЕНИЯ
   ============================================================ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; z-index: 1000000; opacity: 0; pointer-events: none; transition: opacity .2s; padding: 15px; }
.modal.active { opacity: 1; pointer-events: auto; }
.modal-box { background: linear-gradient(180deg, #1a2e1a, #0a1208); border: 2px solid var(--gold); border-radius: 14px; padding: 20px; max-width: 340px; width: 100%; text-align: center; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.modal-title { font-size: 20px; font-weight: 900; color: var(--gold); margin-bottom: 15px; font-family: Georgia, serif; }
.modal-text { font-size: 14px; color: #ccc; margin-bottom: 15px; line-height: 1.4; }
.modal-close { background: #576574; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; margin-top: 15px; width: 100%; font-size: 14px; cursor: pointer; }
.modal-btns { display: flex; flex-direction: column; gap: 8px; }
.modal-btn { padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: 900; cursor: pointer; color: #fff; }
.modal-btn.green { background: linear-gradient(180deg, #2ecc71, #1a7d43); box-shadow: 0 4px 0 #0f3d22; }
.modal-btn.red { background: linear-gradient(180deg, #e74c3c, #922b21); box-shadow: 0 4px 0 #4d0e07; }
.modal-btn:active { transform: translateY(3px); box-shadow: none; }

.notif { position: fixed; top: -80px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 800; transition: top .3s; z-index: 9999999; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,.5); }
.notif.show { top: 15px; } 
.notif.error { background: #e74c3c; } 
.notif.gold { background: linear-gradient(180deg, #ffd966, #b8860b); color: #1a1200; }
</style>
</head>
<body>

</div>

<!-- ============================================================

<div class="modal" id="wheelModal"><div class="modal-box"><div class="modal-title">🎡 КОЛЕСО</div><div class="modal-text">Крути раз в 24 часа!</div><button class="modal-close" onclick="closeModal('wheelModal')">Закрыть</button></div></div>

<!-- ============================================================
     JAVASCRIPT ЛОГИКА
     ============================================================ -->
<script>
// Очистка старых таймеров
for (let i = 1; i < 9999; i++) clearTimeout(i);

// ==========================================
// 1. КОНСТАНТЫ И КОНФИГУРАЦИЯ
// ==========================================
const REELS = 5, ROWS = 5; 
const IMG_VER = '?v=55555555'; // Версия кэша картинок

// Символы и их выпадение
const SYMBOLS = ['gem.png', 'mushroom.png', 'hedgehog.png', 'acorn.png', 'leaf.png', 'coin.png'];
const WEIGHTS = {'gem.png':5, 'mushroom.png':10, 'hedgehog.png':15, 'acorn.png':25, 'leaf.png':25, 'coin.png':30};

// Таблица выплат (x1, x3, x5 символов)
const PAYTABLE = { 
    'gem.png': [15, 60, 250], 
    'mushroom.png': [10, 40, 150], 
    'hedgehog.png': [8, 25, 80], 
    'acorn.png': [5, 15, 50], 
    'leaf.png': [5, 15, 50], 
    'coin.png': [2, 5, 15] 
};

// Линии (координаты [барабан][ряд])
const PAYLINES = [
    [[0,0],[1,0],[2,0],[3,0],[4,0]], [[0,1],[1,1],[2,1],[3,1],[4,1]], 
    [[0,2],[1,2],[2,2],[3,2],[4,2]], [[0,3],[1,3],[2,3],[3,3],[4,3]], 
    [[0,4],[1,4],[2,4],[3,4],[4,4]], [[0,0],[1,1],[2,2],[3,1],[4,0]], 
    [[0,4],[1,3],[2,2],[3,3],[4,4]], [[0,1],[1,2],[2,3],[3,2],[4,1]], 
    [[0,3],[1,2],[2,1],[3,2],[4,3]], [[0,0],[1,0],[2,1],[3,2],[4,2]], 
    [[0,4],[1,4],[2,3],[3,2],[4,2]], [[0,2],[1,1],[2,0],[3,1],[4,2]], 
    [[0,2],[1,3],[2,4],[3,3],[4,2]], [[0,1],[1,0],[2,0],[3,0],[4,1]], 
    [[0,3],[1,4],[2,4],[3,4],[4,3]], [[0,0],[1,1],[2,1],[3,1],[4,0]], 
    [[0,4],[1,3],[2,3],[3,3],[4,4]], [[0,1],[1,1],[2,2],[3,3],[4,3]], 
    [[0,3],[1,3],[2,2],[3,1],[4,1]], [[0,0],[1,2],[2,4],[3,2],[4,0]], 
    [[0,4],[1,2],[2,0],[3,2],[4,4]]
];

const LINE_COLORS = ['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0ff','#5856d6','#af52de','#ff2d95','#ff6b6b','#ffd93d','#6bcf7f','#4ecdc4','#95e1d3','#a8e6cf','#c7ceea','#e2a4d1','#f6d365','#b5eaea','#e0aaff','#ffb4a2'];

// Пул символов для генерации
const POOL = [];
Object.entries(WEIGHTS).forEach(([s,w]) => {
    for(let i=0; i<w; i++) POOL.push(s);
});

// ==========================================
// 2. СОСТОЯНИЕ ИГРЫ
// ==========================================
let state = { 
    balance: 1120, 
    betPerLine: 1, 
    lines: 15, 
    lastDaily: 0, 
    sound: true, 
    lang: 'ru' 
};

let isSpinning = false;
let stopRequested = false;
let freeSpins = 0;
let isFreeSpin = false;
let pendingRisk = 0;
let spinTimeout = null; 

// ==========================================
// 3. АУДИО-СИСТЕМА (Web Audio API + HTML5 Audio)
// ==========================================
let audioCtx = null;
let isAudioInit = false;

// Вспомогательная функция для тактильного отклика (Telegram)
function haptic(type) {
    const tg = window.Telegram?.WebApp;
    if (tg?.HapticFeedback) {
        try {
            if(type==='light') tg.HapticFeedback.impactOccurred('light');
            else if(type==='medium') tg.HapticFeedback.impactOccurred('medium');
            else if(type==='heavy') tg.HapticFeedback.impactOccurred('heavy');
            else if(type==='success') tg.HapticFeedback.notificationOccurred('success');
            else if(type==='error') tg.HapticFeedback.notificationOccurred('error');
            else if(type==='select') tg.HapticFeedback.selectionChanged();
        } catch(e) {}
    }
    if (navigator.vibrate) {
        try { navigator.vibrate(type === 'heavy' ? [30, 50, 30] : 15); } catch(e) {}
    }
}

// Инициализация AudioContext
function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    if (!isAudioInit) {
        isAudioInit = true;
        if (state.sound) {
            playBGM();
        }
    }
}

// Воспроизведение MP3-музыки
function playBGM() {
    const bgm = document.getElementById('bgMusic');
    if (bgm && state.sound) {
        bgm.volume = 0.3; // Громкость музыки (от 0.0 до 1.0)
        bgm.play().catch(e => console.log("Ожидание клика для запуска музыки..."));
    }
}

// Остановка музыки
function stopBGM() {
    const bgm = document.getElementById('bgMusic');
    if (bgm) bgm.pause();
}

// Генератор звуковых эффектов (SFX)
function playTone(freq, type, duration, vol=0.3) {
    if (!audioCtx || !state.sound) return;
    try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

// Библиотека звуков
const sfx = {
    click: () => playTone(800, 'sine', 0.1, 0.4),
    spinStart: () => playTone(150, 'sawtooth', 0.3, 0.2),
    reelStop: () => playTone(300, 'triangle', 0.1, 0.3),
    win: () => { 
        playTone(523.25, 'sine', 0.2, 0.5); 
        setTimeout(()=>playTone(659.25, 'sine', 0.2, 0.5), 100); 
        setTimeout(()=>playTone(783.99, 'sine', 0.3, 0.5), 200); 
    },
    lose: () => playTone(100, 'sawtooth', 0.3, 0.1)
};

// Переключатель звука
function toggleSound() { 
    state.sound = !state.sound; 
    if(state.sound) { 
        initAudio(); 
        sfx.click(); 
        playBGM();
    } else {
        stopBGM();
    }
    haptic('light'); 
    notif(state.sound ? '🔊 Звук ВКЛ' : '🔇 Звук ВЫКЛ'); 
}

// Разблокировка звука при первом клике
document.body.addEventListener('touchstart', initAudio, {once:true});
document.body.addEventListener('click', initAudio, {once:true});

// ==========================================
// 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ UI
// ==========================================
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('ru-RU');

function notif(msg, type='') { 
    const n = $('notif'); 
    n.textContent = msg; 
    n.className = 'notif show ' + type; 
    clearTimeout(n._t); 
    n._t = setTimeout(()=>{ n.className = 'notif ' + type; }, 3000); 
}

const openModal = (id) => { $(id).classList.add('active'); haptic('light'); sfx.click(); };
const closeModal = (id) => { $(id).classList.remove('active'); };

// ==========================================
// 5. ИНИЦИАЛИЗАЦИЯ БАРАБАНОВ
// ==========================================
const reelsEl = $('reels');
const overlay = $('linesOverlay');
const tracks = []; // Ссылки на DOM элементы лент
const reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

const randSym = () => POOL[Math.floor(Math.random() * POOL.length)];
const totalBet = () => state.lines * state.betPerLine;

function buildReels() {
    reelsEl.innerHTML = ''; 
    tracks.length = 0;
    
    for (let r = 0; r < REELS; r++) {
        const reel = document.createElement('div'); 
        reel.className = 'reel';
        const track = document.createElement('div'); 
        track.className = 'track';
        track.style.height = '100%'; 
        
        let html = '';
        for (let row = 0; row < ROWS; row++) {
            html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
        }
        
        track.innerHTML = html; 
        reel.appendChild(track); 
        reelsEl.appendChild(reel); 
        tracks.push(track);
    }
    updateUI();
}

function updateUI() {
    $('balanceVal').textContent = fmt(state.balance); 
    $('betVal').textContent = fmt(state.betPerLine); 
    $('linesVal').textContent = state.lines + '/21';
    $('totalBetVal').textContent = fmt(totalBet());
    if(!isSpinning) $('winVal').textContent = '0';
}

// ==========================================
// 6. ЛОГИКА ВРАЩЕНИЯ БАРАБАНОВ
// ==========================================
function startReelSpin(r) {
    const track = tracks[r]; 
    let html = ''; 
    
    // Генерируем длинную ленту для анимации
    for (let i = 0; i < 40; i++) {
        html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
    }
    
    track.innerHTML = html; 
    let lastTime = performance.now(); 
    const speed = 2000; // Скорость прокрутки
    const frameHeight = track.clientHeight / 5; 
    
    function frame(now) {
        if (!isSpinning) return; 
        const dt = (now - lastTime) / 1000; 
        lastTime = now;
        
        reelPositions[r] -= speed * dt; 
        // Зацикливание позиции
        if (reelPositions[r] <= -(20 * frameHeight)) {
            reelPositions[r] += 20 * frameHeight;
        }
        
        track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
        reelAnimFrames[r] = requestAnimationFrame(frame);
    }
    reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final5) {
    return new Promise(resolve => {
        // Задержка для эффекта каскада
        setTimeout(() => {
            cancelAnimationFrame(reelAnimFrames[r]); 
            const track = tracks[r]; 
            const currentY = reelPositions[r];
            const frameHeight = track.clientHeight / 5; 
            
            // Формируем ленту с финальными символами
            let html = ''; 
            for (let i = 0; i < 15; i++) html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
            final5.forEach(s => html += `<div class="cell"><img src="${s}${IMG_VER}"></div>`);
            for (let i = 0; i < 5; i++) html += `<div class="cell"><img src="${randSym()}${IMG_VER}"></div>`;
            
            track.innerHTML = html; 
            
            // Математика для плавного "доезда" до нужного символа
            let startY = currentY % (15 * frameHeight); 
            if(startY > 0) startY -= 15 * frameHeight;
            
            track.style.transition = 'none'; 
            track.style.transform = `translate3d(0, ${startY}px, 0)`; 
            track.getBoundingClientRect(); // Форсируем reflow
            
            track.style.transition = `transform ${800 + r*200}ms cubic-bezier(0.1, 0.8, 0.2, 1)`; 
            track.style.transform = `translate3d(0, -${15 * frameHeight}px, 0)`;
            
            setTimeout(() => { 
                track.style.transition = 'none'; 
                track.style.transform = 'translate3d(0,0,0)'; 
                track.innerHTML = final5.map(s => `<div class="cell"><img src="${s}${IMG_VER}"></div>`).join(''); 
                haptic('light');
                sfx.reelStop();
                resolve(); 
            }, 800 + r*200 + 50);
        }, r * 200); // Каскадная остановка
    });
}

// ==========================================
// 7. ОСНОВНОЙ ЦИКЛ ИГРЫ (SPIN)
// ==========================================
async function startSpin() {
    if (isSpinning) return;
    
    // Проверка баланса
    if (state.balance < totalBet()) { 
        notif('Недостаточно монет!', 'error'); 
        haptic('error');
        sfx.lose();
        return; 
    }
    
    // Списание ставки
    state.balance -= totalBet(); 
    isSpinning = true; 
    stopRequested = false; 
    $('winVal').textContent = '0';
    
    updateUI(); 
    $('btnRiskUI').classList.remove('active-risk');
    overlay.innerHTML = '';
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('win')); 
    
    haptic('medium');
    sfx.spinStart();
    
    // Предварительная генерация поля (RNG)
    const finalGrid = []; 
    for (let r=0; r<REELS; r++) { 
        const col=[]; 
        for(let c=0; c<ROWS; c++) col.push(randSym()); 
        finalGrid.push(col); 
    }
    
    reelPositions = [0, 0, 0, 0, 0]; 
    tracks.forEach((tr, i) => startReelSpin(i));
    
    // Автостоп через 5 секунд (если игрок не нажал кнопку)
    spinTimeout = setTimeout(() => { 
        if(!stopRequested && isSpinning) requestStop(finalGrid); 
    }, 5000);
}

async function requestStop(pregeneratedGrid) {
    if (!isSpinning || stopRequested) return; 
    stopRequested = true;
    if(spinTimeout) clearTimeout(spinTimeout);
    
    // Остановка барабанов
    const finalGrid = pregeneratedGrid || genGrid(); 
    await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i])));
    
    // Подсчет выигрыша
    let total = 0, scatterCount = 0;
    const winCells = []; 
    
    // Считаем скаттеры (грибы)
    for(let r=0; r<REELS; r++) {
        for(let c=0; c<ROWS; c++) {
            if(finalGrid[r][c] === 'mushroom.png') scatterCount++;
        }
    }

    // Проверка линий
    PAYLINES.slice(0, state.lines).forEach(line => {
        const syms = line.map(([r,row]) => finalGrid[r][row]); 
        const firstSym = syms[0];
        
        if(firstSym === 'mushroom.png') return; // Грибы не собираются в линии
        
        let count = 1;
        for(let i=1; i<REELS; i++) { 
            if(syms[i] === firstSym || syms[i] === 'gem.png') count++; 
            else break; 
        }
        
        if(count >= 3) {
            total += PAYTABLE[firstSym][count-3] * state.betPerLine;
            for(let i=0; i<count; i++) {
                winCells.push({r: line[i][0], c: line[i][1]});
            }
        }
    });

    // Начисление выигрыша
    if (total > 0) {
        if (isFreeSpin) total *= 2; // x2 во фриспинах
        state.balance += total; 
        $('winVal').textContent = fmt(total); 
        notif('Выигрыш: +' + fmt(total), 'gold');
        
        winCells.forEach(cell => {
            const el = tracks[cell.r].children[cell.c];
            if(el) el.classList.add('win');
        });

        haptic('success');
        sfx.win();
        
        // Активация риска
        if (total >= totalBet() * 2 && !isFreeSpin) {
            pendingRisk = total;
            $('btnRiskUI').classList.add('active-risk');
        }
    } else { 
        notif('Повезет в следующий раз!', 'error'); 
        sfx.lose();
    }

    // Проверка фриспинов
    if (scatterCount >= 3 && !isFreeSpin) { 
        freeSpins = 10; 
        notif('🎉 3 ГРИБА! 10 ФРИСПИНОВ x2!', 'gold'); 
        haptic('heavy');
    }
    
    isSpinning = false; 
    updateUI();

    // Запуск фриспина, если есть
    if (freeSpins > 0) { 
        freeSpins--; 
        isFreeSpin = true; 
        spinTimeout = setTimeout(startSpin, 1500); 
    } else { 
        isFreeSpin = false; 
    }
}

function genGrid() {
    const g = [];
    for (let r = 0; r < REELS; r++) { 
        const col = []; 
        for (let row = 0; row < ROWS; row++) col.push(randSym()); 
        g.push(col); 
    }
    return g;
}

// ==========================================
// 8. УПРАВЛЕНИЕ ИНТЕРФЕЙСОМ И НАСТРОЙКАМИ
// ==========================================

// Отображение линий поверх игры
function showActiveLines() {
    overlay.innerHTML = '';
    const fRect = $('reelsFrame').getBoundingClientRect();
    overlay.setAttribute('width', fRect.width);
    overlay.setAttribute('height', fRect.height);

    PAYLINES.slice(0, state.lines).forEach((line, idx) => {
        const pts = [];
        for (const [r, row] of line) {
            const cell = tracks[r].children[row];
            if (!cell) continue;
            const cr = cell.getBoundingClientRect();
            pts.push([cr.left + cr.width/2 - fRect.left, cr.top + cr.height/2 - fRect.top]);
        }
        if (pts.length < 2) return;
        
        const color = LINE_COLORS[idx % LINE_COLORS.length];
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
        poly.setAttribute('stroke', color);
        poly.setAttribute('stroke-width', '5');
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke-linecap', 'round');
        poly.setAttribute('stroke-linejoin', 'round');
        overlay.appendChild(poly);
    });

    setTimeout(() => { overlay.innerHTML = ''; }, 2000);
}

function setLines(num) {
    if(isSpinning) return; 
    state.lines = num; 
    updateUI(); 
    haptic('select');
    sfx.click();
    notif('Линий: ' + num);
    showActiveLines();
}

function cycleLang() {
    const langs = ['ru', 'uk', 'en'];
    let idx = langs.indexOf(state.lang);
    idx = (idx + 1) % langs.length;
    state.lang = langs[idx];
    haptic('light'); sfx.click();
    notif('Language: ' + state.lang.toUpperCase());
}

function toggleAuto() {
    if(isSpinning) return;
    haptic('medium');
    sfx.click();
    notif('Автоспин запущен');
    startSpin();
}

// ==========================================
// 9. РИСК-ИГРА И ЕЖЕДНЕВНЫЙ БОНУС
// ==========================================
function openRiskModal() {
    haptic('light'); sfx.click();
    if (pendingRisk <= 0) { 
        notif('Нет выигрыша для риска!', 'error'); 
        return; 
    }
    $('riskText').textContent = `Вы рискуете суммой ${fmt(pendingRisk)} 🪙. Угадайте карту (шанс 50/50), чтобы удвоить!`;
    openModal('riskModal');
}

function playRisk(isHigher) {
    if (pendingRisk <= 0) return;
    closeModal('riskModal');
    
    const card1 = Math.floor(Math.random() * 13) + 1;
    const card2 = Math.floor(Math.random() * 13) + 1;
    
    let won = false;
    if (isHigher) won = card2 > card1; 
    else won = card2 < card1;
    
    if (card1 === card2) won = false; // Ничья в пользу казино

    if (won) {
        state.balance += pendingRisk; 
        notif(`🎉 Победа! +${fmt(pendingRisk)}`, 'gold');
        haptic('success'); sfx.win();
    } else {
        state.balance -= pendingRisk; 
        notif(`❌ Проигрыш: -${fmt(pendingRisk)}`, 'error');
        haptic('error'); sfx.lose();
    }
    
    pendingRisk = 0;
    $('btnRiskUI').classList.remove('active-risk');
    updateUI();
}

function takeRiskMoney() {
    closeModal('riskModal');
    pendingRisk = 0;
    $('btnRiskUI').classList.remove('active-risk');
    notif('Вы забрали выигрыш!', 'success');
    haptic('success'); sfx.click();
}

function claimDaily() {
    if (Date.now() - state.lastDaily < 24*3600*1000) { 
        notif('Бонус уже получен! Ждите 24ч', 'error'); 
        return; 
    }
    
    state.lastDaily = Date.now(); 
    state.balance += 1000; 
    updateUI(); 
    notif('🎁 Ежедневный бонус: +1000 🪙', 'gold');
    haptic('heavy'); sfx.win();
}

// ==========================================
// 10. ПРИВЯЗКА СОБЫТИЙ
// ==========================================

// Старт игры
$('startBtn').onclick = () => {
    initAudio();
    $('startScreen').classList.add('hidden');
    buildReels();
    haptic('success');
    sfx.click();
};

// Визуальный отклик на кнопки
document.querySelectorAll('.btn-overlay').forEach(btn => {
    btn.addEventListener('touchstart', function() {
        this.classList.add('glow');
        setTimeout(() => this.classList.remove('glow'), 300);
    });
});

// Кнопка SPIN
$('spinBtn').onclick = (e) => { 
    e.preventDefault(); e.stopPropagation();
    if (isSpinning) requestStop(); 
    else startSpin(); 
};

// Управление ставками и линиями
$('linesDec').onclick = () => { if(!isSpinning) setLines(Math.max(1, state.lines-1)); };
$('linesInc').onclick = () => { if(!isSpinning) setLines(Math.min(21, state.lines+1)); };
$('betDec').onclick = () => { 
    if(!isSpinning){ 
        state.betPerLine = Math.max(1, state.betPerLine-1); 
        updateUI(); haptic('select'); sfx.click(); 
    } 
};
$('betInc').onclick = () => { 
    if(!isSpinning){ 
        state.betPerLine += 1; 
        updateUI(); haptic('select'); sfx.click(); 
    } 
};

// Адаптация при повороте экрана
window.addEventListener('resize', () => { 
    if(!isSpinning) buildReels(); 
});
